<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CRM migration pipeline</title>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #171a24; font-family: 'Geist', system-ui, sans-serif; }
    svg#d { width: 1200px; height: 675px; display: block; }
  </style>
</head>
<body>
  <svg id="d" viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg"
       role="img" aria-labelledby="crm-title crm-desc">
    <title id="crm-title">CRM migration pipeline</title>
    <desc id="crm-desc">Contacts from more than twenty spreadsheets and CRM exports are normalised, joint applicants are split into one person per record, duplicates are merged and tags applied, and a single validation step decides what reaches the import-ready master. Anything that fails a rule goes back for review at its source.</desc>

    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#9aa4bd"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#ea4b71"/></marker>
      <marker id="arrow-soft" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6b7590"/></marker>
      <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="rgba(232,236,245,0.07)"/></pattern>
    </defs>

    <rect width="100%" height="100%" fill="#171a24"/>
    <rect width="100%" height="100%" fill="url(#dots)"/>

    <!-- counts -->
    <text x="120" y="212" fill="#7f8aa5" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em" text-anchor="middle">4,000+ CONTACTS IN</text>
    <text x="1060" y="212" fill="#f3aec0" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em" text-anchor="middle">1,900+ RECORDS OUT</text>

    <!-- spine -->
    <line x1="180" y1="256" x2="212" y2="256" stroke="#9aa4bd" stroke-width="1.4" marker-end="url(#arrow)"/>
    <line x1="336" y1="256" x2="368" y2="256" stroke="#9aa4bd" stroke-width="1.4" marker-end="url(#arrow)"/>
    <line x1="492" y1="256" x2="524" y2="256" stroke="#9aa4bd" stroke-width="1.4" marker-end="url(#arrow)"/>
    <line x1="648" y1="256" x2="680" y2="256" stroke="#9aa4bd" stroke-width="1.4" marker-end="url(#arrow)"/>
    <line x1="804" y1="256" x2="836" y2="256" stroke="#9aa4bd" stroke-width="1.4" marker-end="url(#arrow)"/>
    <line x1="964" y1="256" x2="992" y2="256" stroke="#ea4b71" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

    <!-- reject -->
    <path d="M900,304 V396" fill="none" stroke="#6b7590" stroke-width="1.2" marker-end="url(#arrow-soft)"/>
    <rect x="908" y="340" width="92" height="14" rx="2" fill="#171a24"/>
    <text x="912" y="351" fill="#7f8aa5" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.08em">FAILS A RULE</text>

    <!-- 1. sources -->
    <rect x="60" y="224" width="120" height="64" rx="32" fill="#171a24"/>
    <rect x="60" y="224" width="120" height="64" rx="32" fill="rgba(52,211,153,0.06)" stroke="#34d399" stroke-width="1"/>
    <circle cx="120" cy="240" r="4" fill="#34d399"/>
    <text x="120" y="264" fill="#e8ecf5" font-size="12" font-weight="600" text-anchor="middle">20+ sources</text>
    <text x="120" y="278" fill="#9aa4bd" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">sheets + exports</text>

    <!-- 2. normalise -->
    <rect x="216" y="224" width="120" height="64" rx="6" fill="#171a24"/>
    <rect x="216" y="224" width="120" height="64" rx="6" fill="#232838" stroke="#39415a" stroke-width="1"/>
    <circle cx="276" cy="240" r="4" fill="#818cf8"/>
    <text x="276" y="264" fill="#e8ecf5" font-size="12" font-weight="600" text-anchor="middle">Normalise</text>
    <text x="276" y="278" fill="#9aa4bd" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">email · phone · name</text>

    <!-- 3. split -->
    <rect x="372" y="224" width="120" height="64" rx="6" fill="#171a24"/>
    <rect x="372" y="224" width="120" height="64" rx="6" fill="#232838" stroke="#39415a" stroke-width="1"/>
    <circle cx="432" cy="240" r="4" fill="#818cf8"/>
    <text x="432" y="264" fill="#e8ecf5" font-size="12" font-weight="600" text-anchor="middle">Split couples</text>
    <text x="432" y="278" fill="#9aa4bd" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">one person a row</text>

    <!-- 4. dedupe -->
    <rect x="528" y="224" width="120" height="64" rx="6" fill="#171a24"/>
    <rect x="528" y="224" width="120" height="64" rx="6" fill="#232838" stroke="#39415a" stroke-width="1"/>
    <circle cx="588" cy="240" r="4" fill="#818cf8"/>
    <text x="588" y="264" fill="#e8ecf5" font-size="12" font-weight="600" text-anchor="middle">Deduplicate</text>
    <text x="588" y="278" fill="#9aa4bd" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">email, then phone</text>

    <!-- 5. tag -->
    <rect x="684" y="224" width="120" height="64" rx="6" fill="#171a24"/>
    <rect x="684" y="224" width="120" height="64" rx="6" fill="#232838" stroke="#39415a" stroke-width="1"/>
    <circle cx="744" cy="240" r="4" fill="#818cf8"/>
    <text x="744" y="264" fill="#e8ecf5" font-size="12" font-weight="600" text-anchor="middle">Tag</text>
    <text x="744" y="278" fill="#9aa4bd" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">one fact per tag</text>

    <!-- 6. validate -->
    <polygon points="900,208 964,256 900,304 836,256" fill="#171a24"/>
    <polygon points="900,208 964,256 900,304 836,256" fill="#232838" stroke="#39415a" stroke-width="1"/>
    <circle cx="900" cy="232" r="4" fill="#fbbf24"/>
    <text x="900" y="264" fill="#e8ecf5" font-size="12" font-weight="600" text-anchor="middle">Valid?</text>

    <!-- 7. FOCAL: the master -->
    <rect x="996" y="224" width="128" height="64" rx="6" fill="#171a24"/>
    <rect x="996" y="224" width="128" height="64" rx="6" fill="rgba(234,75,113,0.10)" stroke="#ea4b71" stroke-width="1.2"/>
    <circle cx="1060" cy="240" r="4" fill="#c084fc"/>
    <text x="1060" y="264" fill="#ffffff" font-size="12" font-weight="600" text-anchor="middle">Import master</text>
    <text x="1060" y="278" fill="#f3aec0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ready for the CRM</text>

    <!-- review -->
    <rect x="820" y="400" width="160" height="56" rx="28" fill="#171a24"/>
    <rect x="820" y="400" width="160" height="56" rx="28" fill="rgba(154,164,189,0.06)" stroke="#6b7590" stroke-width="1"/>
    <text x="900" y="426" fill="#c8cfdf" font-size="12" font-weight="600" text-anchor="middle">Review queue</text>
    <text x="900" y="440" fill="#7f8aa5" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">fixed at the source</text>

    <!-- legend -->
    <line x1="72" y1="560" x2="1128" y2="560" stroke="rgba(232,236,245,0.12)" stroke-width="0.8"/>
    <text x="72" y="584" fill="#7f8aa5" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">PYTHON STEP</text>
    <circle cx="216" cy="580" r="4" fill="#34d399"/>
    <text x="228" y="584" fill="#9aa4bd" font-size="9" font-family="'Geist Mono', monospace">input</text>
    <circle cx="336" cy="580" r="4" fill="#818cf8"/>
    <text x="348" y="584" fill="#9aa4bd" font-size="9" font-family="'Geist Mono', monospace">transform</text>
    <circle cx="472" cy="580" r="4" fill="#fbbf24"/>
    <text x="484" y="584" fill="#9aa4bd" font-size="9" font-family="'Geist Mono', monospace">check</text>
    <circle cx="592" cy="580" r="4" fill="#c084fc"/>
    <text x="604" y="584" fill="#9aa4bd" font-size="9" font-family="'Geist Mono', monospace">output</text>
  </svg>
</body>
</html>
