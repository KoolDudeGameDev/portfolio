<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CRM migration pipeline</title>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #171a24; font-family: 'Geist', system-ui, sans-serif; }
    svg#d { width: 1200px; height: 675px; display: block; }
  </style>
</head>
<body>
  <svg id="d" viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg"
       role="img" aria-labelledby="crm-title crm-desc">
    <title id="crm-title">CRM migration and data pipeline</title>
    <desc id="crm-desc">Contacts arrive from more than twenty spreadsheets and exports. A Python pipeline normalises email, phone and name, splits joint contacts so one person is one row, deduplicates on email and then phone, and tags each fact once. Anything that fails a rule goes to a review queue to be fixed at the source rather than guessed at, and what passes becomes the import master.</desc>

    <defs>
      <marker id="arrow" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto"><polygon points="0 0, 6 2.5, 0 5" fill="#9aa4bd"/></marker>
      <marker id="arrow-accent" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto"><polygon points="0 0, 6 2.5, 0 5" fill="#ea4b71"/></marker>
      <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="rgba(232,236,245,0.07)"/></pattern>
    </defs>

    <rect width="100%" height="100%" fill="#171a24"/>
    <rect width="100%" height="100%" fill="url(#dots)"/>

    <!-- header -->
    <text x="56" y="84" fill="#7f8aa5" font-size="13" font-family="'Geist Mono', monospace" letter-spacing="0.14em">CRM MIGRATION · ONE PYTHON PIPELINE, RERUNNABLE</text>
    <line x1="56" y1="104" x2="1144" y2="104" stroke="rgba(232,236,245,0.10)" stroke-width="1"/>

    <!-- spine -->
    <g fill="none" stroke="#9aa4bd" stroke-width="2.4">
      <path d="M256,212 H270" marker-end="url(#arrow)"/>
      <path d="M478,212 H492" marker-end="url(#arrow)"/>
      <path d="M700,212 H714" marker-end="url(#arrow)"/>
      <path d="M922,212 H936" marker-end="url(#arrow)"/>
      <path d="M1044,264 V344" marker-end="url(#arrow)"/>
      <path d="M1044,448 V540 H892" marker-end="url(#arrow)"/>
    </g>
    <path d="M944,400 H888" fill="none" stroke="#ea4b71" stroke-width="2.4" marker-end="url(#arrow-accent)"/>
    <text x="916" y="380" fill="#7f8aa5" font-size="13" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PASSES</text>
    <text x="912" y="520" fill="#7f8aa5" font-size="13" font-family="'Geist Mono', monospace" letter-spacing="0.08em">FAILS A RULE</text>

    <!-- row 1: the transforms -->
    <rect x="56" y="160" width="200" height="104" rx="52" fill="#171a24"/>
    <rect x="56" y="160" width="200" height="104" rx="52" fill="rgba(52,211,153,0.06)" stroke="#34d399" stroke-width="1.4"/>
    <circle cx="156" cy="182" r="6" fill="#34d399"/>
    <text x="156" y="218" fill="#e8ecf5" font-size="24" font-weight="600" text-anchor="middle">20+ sources</text>
    <text x="156" y="242" fill="#9aa4bd" font-size="14" font-family="'Geist Mono', monospace" text-anchor="middle">sheets + exports</text>

    <rect x="278" y="160" width="200" height="104" rx="8" fill="#232838" stroke="#39415a" stroke-width="1.2"/>
    <circle cx="378" cy="182" r="6" fill="#818cf8"/>
    <text x="378" y="218" fill="#e8ecf5" font-size="24" font-weight="600" text-anchor="middle">Normalise</text>
    <text x="378" y="242" fill="#9aa4bd" font-size="14" font-family="'Geist Mono', monospace" text-anchor="middle">email · phone · name</text>

    <rect x="500" y="160" width="200" height="104" rx="8" fill="#232838" stroke="#39415a" stroke-width="1.2"/>
    <circle cx="600" cy="182" r="6" fill="#818cf8"/>
    <text x="600" y="218" fill="#e8ecf5" font-size="24" font-weight="600" text-anchor="middle">Split couples</text>
    <text x="600" y="242" fill="#9aa4bd" font-size="14" font-family="'Geist Mono', monospace" text-anchor="middle">one person a row</text>

    <rect x="722" y="160" width="200" height="104" rx="8" fill="#232838" stroke="#39415a" stroke-width="1.2"/>
    <circle cx="822" cy="182" r="6" fill="#818cf8"/>
    <text x="822" y="218" fill="#e8ecf5" font-size="24" font-weight="600" text-anchor="middle">Deduplicate</text>
    <text x="822" y="242" fill="#9aa4bd" font-size="14" font-family="'Geist Mono', monospace" text-anchor="middle">email, then phone</text>

    <rect x="944" y="160" width="200" height="104" rx="8" fill="#232838" stroke="#39415a" stroke-width="1.2"/>
    <circle cx="1044" cy="182" r="6" fill="#818cf8"/>
    <text x="1044" y="218" fill="#e8ecf5" font-size="24" font-weight="600" text-anchor="middle">Tag</text>
    <text x="1044" y="242" fill="#9aa4bd" font-size="14" font-family="'Geist Mono', monospace" text-anchor="middle">one fact per tag</text>

    <!-- gate -->
    <path d="M944,400 L1044,344 L1144,400 L1044,448 Z" fill="#232838" stroke="#39415a" stroke-width="1.2"/>
    <circle cx="1044" cy="374" r="6" fill="#fbbf24"/>
    <text x="1044" y="412" fill="#e8ecf5" font-size="24" font-weight="600" text-anchor="middle">Valid?</text>

    <!-- FOCAL: the import master -->
    <rect x="608" y="348" width="280" height="104" rx="8" fill="#171a24"/>
    <rect x="608" y="348" width="280" height="104" rx="8" fill="rgba(234,75,113,0.10)" stroke="#ea4b71" stroke-width="1.6"/>
    <circle cx="748" cy="370" r="6" fill="#ea4b71"/>
    <text x="748" y="406" fill="#ffffff" font-size="24" font-weight="600" text-anchor="middle">Import master</text>
    <text x="748" y="430" fill="#f3aec0" font-size="14" font-family="'Geist Mono', monospace" text-anchor="middle">ready for the CRM</text>

    <!-- review queue -->
    <rect x="608" y="496" width="280" height="88" rx="44" fill="#1d2130" stroke="#39415a" stroke-width="1.2"/>
    <text x="748" y="536" fill="#e8ecf5" font-size="24" font-weight="600" text-anchor="middle">Review queue</text>
    <text x="748" y="560" fill="#9aa4bd" font-size="14" font-family="'Geist Mono', monospace" text-anchor="middle">fixed at the source</text>

    <!-- what came out -->
    <rect x="56" y="348" width="488" height="236" rx="10" fill="rgba(232,236,245,0.02)" stroke="rgba(232,236,245,0.10)" stroke-width="1"/>
    <text x="84" y="386" fill="#7f8aa5" font-size="13" font-family="'Geist Mono', monospace" letter-spacing="0.14em">WHAT WENT IN, WHAT CAME OUT</text>
    <line x1="84" y1="402" x2="516" y2="402" stroke="rgba(232,236,245,0.08)" stroke-width="1"/>

    <text x="84" y="456" fill="#e8ecf5" font-size="42" font-weight="600">4,000+</text>
    <text x="268" y="446" fill="#9aa4bd" font-size="16" font-family="'Geist Mono', monospace">contacts in, across</text>
    <text x="268" y="468" fill="#9aa4bd" font-size="16" font-family="'Geist Mono', monospace">20+ spreadsheets</text>

    <text x="84" y="542" fill="#e8ecf5" font-size="42" font-weight="600">1,900+</text>
    <text x="268" y="532" fill="#9aa4bd" font-size="16" font-family="'Geist Mono', monospace">records out, one</text>
    <text x="268" y="554" fill="#9aa4bd" font-size="16" font-family="'Geist Mono', monospace">person to a row</text>

    <!-- legend -->
    <line x1="56" y1="612" x2="1144" y2="612" stroke="rgba(232,236,245,0.12)" stroke-width="1"/>
    <text x="56" y="644" fill="#7f8aa5" font-size="13" font-family="'Geist Mono', monospace" letter-spacing="0.14em">PYTHON STEP</text>
    <circle cx="232" cy="639" r="6" fill="#34d399"/>
    <text x="248" y="644" fill="#9aa4bd" font-size="15" font-family="'Geist Mono', monospace">input</text>
    <circle cx="376" cy="639" r="6" fill="#818cf8"/>
    <text x="392" y="644" fill="#9aa4bd" font-size="15" font-family="'Geist Mono', monospace">transform</text>
    <circle cx="568" cy="639" r="6" fill="#fbbf24"/>
    <text x="584" y="644" fill="#9aa4bd" font-size="15" font-family="'Geist Mono', monospace">check</text>
    <circle cx="712" cy="639" r="6" fill="#ea4b71"/>
    <text x="728" y="644" fill="#9aa4bd" font-size="15" font-family="'Geist Mono', monospace">output</text>
  </svg>
</body>
</html>
