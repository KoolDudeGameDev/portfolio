<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Self-hosted automation platform</title>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #171a24; font-family: 'Geist', system-ui, sans-serif; }
    svg#d { width: 1200px; height: 675px; display: block; }
  </style>
</head>
<body>
  <svg id="d" viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg"
       role="img" aria-labelledby="plat-title plat-desc">
    <title id="plat-title">Self-hosted automation platform</title>
    <desc id="plat-desc">Public HTTPS traffic reaches a Traefik edge proxy on an OVH VPS running Docker Compose, which terminates TLS and passes it to n8n. n8n keeps execution state in Postgres, vectors in Qdrant and runs models locally through Ollama. Every workflow is exported to a git repository that outlives the host, which is the copy that survives losing the machine.</desc>

    <defs>
      <marker id="arrow" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto"><polygon points="0 0, 6 2.5, 0 5" fill="#9aa4bd"/></marker>
      <marker id="arrow-accent" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto"><polygon points="0 0, 6 2.5, 0 5" fill="#ea4b71"/></marker>
      <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="rgba(232,236,245,0.07)"/></pattern>
    </defs>

    <rect width="100%" height="100%" fill="#171a24"/>
    <rect width="100%" height="100%" fill="url(#dots)"/>

    <!-- header -->
    <text x="56" y="84" fill="#7f8aa5" font-size="13" font-family="'Geist Mono', monospace" letter-spacing="0.14em">SELF-HOSTED AUTOMATION PLATFORM · MIGRATED OFF A HOSTED PLAN</text>
    <line x1="56" y1="104" x2="1144" y2="104" stroke="rgba(232,236,245,0.10)" stroke-width="1"/>

    <!-- the box -->
    <rect x="344" y="132" width="800" height="348" rx="10" fill="rgba(232,236,245,0.015)" stroke="rgba(232,236,245,0.10)" stroke-dasharray="5 5"/>
    <text x="368" y="160" fill="#7f8aa5" font-size="13" font-family="'Geist Mono', monospace" letter-spacing="0.14em">OVH VPS · DEBIAN 12 · DOCKER COMPOSE</text>

    <!-- wires -->
    <g fill="none" stroke="#9aa4bd" stroke-width="2.4">
      <path d="M288,312 H380" marker-end="url(#arrow)"/>
      <path d="M876,288 H904 V204 H924" marker-end="url(#arrow)"/>
      <path d="M876,312 H924" marker-end="url(#arrow)"/>
      <path d="M876,336 H904 V420 H924" marker-end="url(#arrow)"/>
      <path d="M768,364 V500" marker-end="url(#arrow)"/>
    </g>
    <path d="M288,448 H500 V372" fill="none" stroke="#9aa4bd" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
    <path d="M608,312 H652" fill="none" stroke="#ea4b71" stroke-width="2.4" marker-end="url(#arrow-accent)"/>
    <text x="304" y="434" fill="#7f8aa5" font-size="13" font-family="'Geist Mono', monospace" letter-spacing="0.08em">RESOLVES</text>
    <text x="788" y="444" fill="#7f8aa5" font-size="13" font-family="'Geist Mono', monospace" letter-spacing="0.08em">EXPORT, NIGHTLY</text>

    <!-- entry -->
    <rect x="56" y="260" width="232" height="104" rx="52" fill="#171a24"/>
    <rect x="56" y="260" width="232" height="104" rx="52" fill="rgba(52,211,153,0.06)" stroke="#34d399" stroke-width="1.4"/>
    <circle cx="172" cy="282" r="6" fill="#34d399"/>
    <text x="172" y="318" fill="#e8ecf5" font-size="24" font-weight="600" text-anchor="middle">Public traffic</text>
    <text x="172" y="342" fill="#9aa4bd" font-size="15" font-family="'Geist Mono', monospace" text-anchor="middle">HTTPS only</text>

    <!-- dns -->
    <rect x="56" y="404" width="232" height="88" rx="8" fill="#1d2130" stroke="#39415a" stroke-width="1.2"/>
    <circle cx="172" cy="426" r="6" fill="#8b93a8"/>
    <text x="172" y="458" fill="#e8ecf5" font-size="24" font-weight="600" text-anchor="middle">DNS</text>
    <text x="172" y="480" fill="#9aa4bd" font-size="15" font-family="'Geist Mono', monospace" text-anchor="middle">A record to the box</text>

    <!-- edge proxy -->
    <rect x="392" y="260" width="216" height="104" rx="8" fill="#232838" stroke="#39415a" stroke-width="1.2"/>
    <circle cx="500" cy="282" r="6" fill="#fbbf24"/>
    <text x="500" y="318" fill="#e8ecf5" font-size="24" font-weight="600" text-anchor="middle">Traefik</text>
    <text x="500" y="342" fill="#9aa4bd" font-size="15" font-family="'Geist Mono', monospace" text-anchor="middle">TLS · 80 → 443</text>

    <!-- FOCAL: the platform itself -->
    <rect x="660" y="260" width="216" height="104" rx="8" fill="#171a24"/>
    <rect x="660" y="260" width="216" height="104" rx="8" fill="rgba(234,75,113,0.10)" stroke="#ea4b71" stroke-width="1.6"/>
    <circle cx="768" cy="282" r="6" fill="#ea4b71"/>
    <text x="768" y="318" fill="#ffffff" font-size="24" font-weight="600" text-anchor="middle">n8n</text>
    <text x="768" y="342" fill="#f3aec0" font-size="15" font-family="'Geist Mono', monospace" text-anchor="middle">workflows + API</text>

    <!-- stores -->
    <rect x="928" y="156" width="192" height="96" rx="8" fill="#232838" stroke="#39415a" stroke-width="1.2"/>
    <circle cx="1024" cy="178" r="6" fill="#c084fc"/>
    <text x="1024" y="212" fill="#e8ecf5" font-size="24" font-weight="600" text-anchor="middle">Postgres 16</text>
    <text x="1024" y="234" fill="#9aa4bd" font-size="15" font-family="'Geist Mono', monospace" text-anchor="middle">execution state</text>

    <rect x="928" y="264" width="192" height="96" rx="8" fill="#232838" stroke="#39415a" stroke-width="1.2"/>
    <circle cx="1024" cy="286" r="6" fill="#c084fc"/>
    <text x="1024" y="320" fill="#e8ecf5" font-size="24" font-weight="600" text-anchor="middle">Qdrant</text>
    <text x="1024" y="342" fill="#9aa4bd" font-size="15" font-family="'Geist Mono', monospace" text-anchor="middle">vector store</text>

    <rect x="928" y="372" width="192" height="96" rx="8" fill="#232838" stroke="#39415a" stroke-width="1.2"/>
    <circle cx="1024" cy="394" r="6" fill="#22d3ee"/>
    <text x="1024" y="428" fill="#e8ecf5" font-size="24" font-weight="600" text-anchor="middle">Ollama</text>
    <text x="1024" y="450" fill="#9aa4bd" font-size="15" font-family="'Geist Mono', monospace" text-anchor="middle">local models</text>

    <!-- the copy that survives the host -->
    <rect x="660" y="504" width="216" height="88" rx="8" fill="#1d2130" stroke="#39415a" stroke-width="1.2"/>
    <circle cx="768" cy="526" r="6" fill="#8b93a8"/>
    <text x="768" y="558" fill="#e8ecf5" font-size="24" font-weight="600" text-anchor="middle">Git repo</text>
    <text x="768" y="580" fill="#9aa4bd" font-size="15" font-family="'Geist Mono', monospace" text-anchor="middle">outlives the host</text>

    <!-- legend -->
    <line x1="56" y1="612" x2="1144" y2="612" stroke="rgba(232,236,245,0.12)" stroke-width="1"/>
    <text x="56" y="644" fill="#7f8aa5" font-size="13" font-family="'Geist Mono', monospace" letter-spacing="0.14em">ROLE</text>
    <circle cx="140" cy="639" r="6" fill="#ea4b71"/>
    <text x="156" y="644" fill="#9aa4bd" font-size="15" font-family="'Geist Mono', monospace">platform</text>
    <circle cx="296" cy="639" r="6" fill="#34d399"/>
    <text x="312" y="644" fill="#9aa4bd" font-size="15" font-family="'Geist Mono', monospace">entry</text>
    <circle cx="412" cy="639" r="6" fill="#fbbf24"/>
    <text x="428" y="644" fill="#9aa4bd" font-size="15" font-family="'Geist Mono', monospace">edge proxy</text>
    <circle cx="596" cy="639" r="6" fill="#c084fc"/>
    <text x="612" y="644" fill="#9aa4bd" font-size="15" font-family="'Geist Mono', monospace">data</text>
    <circle cx="704" cy="639" r="6" fill="#22d3ee"/>
    <text x="720" y="644" fill="#9aa4bd" font-size="15" font-family="'Geist Mono', monospace">model</text>
    <circle cx="824" cy="639" r="6" fill="#8b93a8"/>
    <text x="840" y="644" fill="#9aa4bd" font-size="15" font-family="'Geist Mono', monospace">external</text>
  </svg>
</body>
</html>
