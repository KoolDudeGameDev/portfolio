<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Three open-source workflows</title>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #171a24; font-family: 'Geist', system-ui, sans-serif; }
    svg#d { width: 1200px; height: 675px; display: block; }
  </style>
</head>
<body>
  <svg id="d" viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg"
       role="img" aria-labelledby="oss-title oss-desc">
    <title id="oss-title">Three open-source workflows, each built around a failure mode</title>
    <desc id="oss-desc">Three smaller published workflows, each defined by what it does when something goes wrong. The endpoint health check probes every target before reporting, so ten dead endpoints produce one digest rather than ten alerts and silence is the success case. The git backup names files by workflow id so a rename produces a diff rather than an orphan, and lives off the machine it protects. The company enrichment run profiles one homepage at a time, so a dead site fails only its own row and the model may answer unknown.</desc>

    <defs>
      <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="rgba(232,236,245,0.07)"/></pattern>
    </defs>

    <rect width="100%" height="100%" fill="#171a24"/>
    <rect width="100%" height="100%" fill="url(#dots)"/>

    <!-- header -->
    <text x="56" y="84" fill="#7f8aa5" font-size="13" font-family="'Geist Mono', monospace" letter-spacing="0.14em">THREE OPEN-SOURCE WORKFLOWS · EACH ONE IS ITS FAILURE MODE</text>
    <line x1="56" y1="104" x2="1144" y2="104" stroke="rgba(232,236,245,0.10)" stroke-width="1"/>

    <!-- panel 1 -->
    <rect x="56" y="140" width="352" height="440" rx="10" fill="rgba(232,236,245,0.02)" stroke="rgba(232,236,245,0.10)" stroke-width="1"/>
    <circle cx="88" cy="176" r="6" fill="#34d399"/>
    <text x="104" y="182" fill="#7f8aa5" font-size="13" font-family="'Geist Mono', monospace" letter-spacing="0.14em">ENDPOINT HEALTH CHECK</text>
    <line x1="80" y1="200" x2="384" y2="200" stroke="rgba(232,236,245,0.08)" stroke-width="1"/>
    <text x="80" y="240" fill="#e8ecf5" font-size="26" font-weight="600">One digest,</text>
    <text x="80" y="270" fill="#e8ecf5" font-size="26" font-weight="600">not ten alerts</text>

    <rect x="80" y="300" width="304" height="48" rx="6" fill="#232838" stroke="#39415a" stroke-width="1.2"/>
    <text x="232" y="330" fill="#e8ecf5" font-size="17" font-weight="500" text-anchor="middle">Probe every target first</text>
    <rect x="80" y="360" width="304" height="48" rx="6" fill="#232838" stroke="#39415a" stroke-width="1.2"/>
    <text x="232" y="390" fill="#e8ecf5" font-size="17" font-weight="500" text-anchor="middle">Collect the failures</text>
    <rect x="80" y="420" width="304" height="48" rx="6" fill="rgba(234,75,113,0.10)" stroke="#ea4b71" stroke-width="1.4"/>
    <text x="232" y="450" fill="#ffffff" font-size="17" font-weight="500" text-anchor="middle">Send only if any are down</text>

    <line x1="80" y1="500" x2="384" y2="500" stroke="rgba(232,236,245,0.08)" stroke-width="1"/>
    <text x="80" y="530" fill="#9aa4bd" font-size="16" font-family="'Geist Mono', monospace">One dead endpoint can't</text>
    <text x="80" y="552" fill="#9aa4bd" font-size="16" font-family="'Geist Mono', monospace">hide the ones behind it.</text>

    <!-- panel 2 -->
    <rect x="424" y="140" width="352" height="440" rx="10" fill="rgba(232,236,245,0.02)" stroke="rgba(232,236,245,0.10)" stroke-width="1"/>
    <circle cx="456" cy="176" r="6" fill="#818cf8"/>
    <text x="472" y="182" fill="#7f8aa5" font-size="13" font-family="'Geist Mono', monospace" letter-spacing="0.14em">WORKFLOW BACKUP TO GIT</text>
    <line x1="448" y1="200" x2="752" y2="200" stroke="rgba(232,236,245,0.08)" stroke-width="1"/>
    <text x="448" y="240" fill="#e8ecf5" font-size="26" font-weight="600">A rename is</text>
    <text x="448" y="270" fill="#e8ecf5" font-size="26" font-weight="600">a diff, not a loss</text>

    <rect x="448" y="300" width="304" height="48" rx="6" fill="#232838" stroke="#39415a" stroke-width="1.2"/>
    <text x="600" y="330" fill="#e8ecf5" font-size="17" font-weight="500" text-anchor="middle">Export every workflow</text>
    <rect x="448" y="360" width="304" height="48" rx="6" fill="#232838" stroke="#39415a" stroke-width="1.2"/>
    <text x="600" y="390" fill="#e8ecf5" font-size="17" font-weight="500" text-anchor="middle">Strip self-changing fields</text>
    <rect x="448" y="420" width="304" height="48" rx="6" fill="#232838" stroke="#39415a" stroke-width="1.2"/>
    <text x="600" y="450" fill="#e8ecf5" font-size="17" font-weight="500" text-anchor="middle">Commit, named by id</text>

    <line x1="448" y1="500" x2="752" y2="500" stroke="rgba(232,236,245,0.08)" stroke-width="1"/>
    <text x="448" y="530" fill="#9aa4bd" font-size="16" font-family="'Geist Mono', monospace">It exists because a hosted</text>
    <text x="448" y="552" fill="#9aa4bd" font-size="16" font-family="'Geist Mono', monospace">plan ended, taking its db.</text>

    <!-- panel 3 -->
    <rect x="792" y="140" width="352" height="440" rx="10" fill="rgba(232,236,245,0.02)" stroke="rgba(232,236,245,0.10)" stroke-width="1"/>
    <circle cx="824" cy="176" r="6" fill="#22d3ee"/>
    <text x="840" y="182" fill="#7f8aa5" font-size="13" font-family="'Geist Mono', monospace" letter-spacing="0.14em">COMPANY ENRICHMENT</text>
    <line x1="816" y1="200" x2="1120" y2="200" stroke="rgba(232,236,245,0.08)" stroke-width="1"/>
    <text x="816" y="240" fill="#e8ecf5" font-size="26" font-weight="600">A dead site fails</text>
    <text x="816" y="270" fill="#e8ecf5" font-size="26" font-weight="600">its own row only</text>

    <rect x="816" y="300" width="304" height="48" rx="6" fill="#232838" stroke="#39415a" stroke-width="1.2"/>
    <text x="968" y="330" fill="#e8ecf5" font-size="17" font-weight="500" text-anchor="middle">One company at a time</text>
    <rect x="816" y="360" width="304" height="48" rx="6" fill="#232838" stroke="#39415a" stroke-width="1.2"/>
    <text x="968" y="390" fill="#e8ecf5" font-size="17" font-weight="500" text-anchor="middle">Profile the homepage</text>
    <rect x="816" y="420" width="304" height="48" rx="6" fill="#232838" stroke="#39415a" stroke-width="1.2"/>
    <text x="968" y="450" fill="#e8ecf5" font-size="17" font-weight="500" text-anchor="middle">Write the profile back</text>

    <line x1="816" y1="500" x2="1120" y2="500" stroke="rgba(232,236,245,0.08)" stroke-width="1"/>
    <text x="816" y="530" fill="#9aa4bd" font-size="16" font-family="'Geist Mono', monospace">The model may answer</text>
    <text x="816" y="552" fill="#9aa4bd" font-size="16" font-family="'Geist Mono', monospace">unknown. A blank beats</text>
    <text x="816" y="574" fill="#9aa4bd" font-size="16" font-family="'Geist Mono', monospace">a guess.</text>

    <!-- legend -->
    <line x1="56" y1="612" x2="1144" y2="612" stroke="rgba(232,236,245,0.12)" stroke-width="1"/>
    <text x="56" y="644" fill="#7f8aa5" font-size="13" font-family="'Geist Mono', monospace" letter-spacing="0.14em">PUBLISHED</text>
    <text x="196" y="644" fill="#9aa4bd" font-size="15" font-family="'Geist Mono', monospace">importable n8n JSON · no client data · every secret an env reference</text>
  </svg>
</body>
</html>
