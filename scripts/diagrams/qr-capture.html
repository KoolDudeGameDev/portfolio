<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>QR lead capture</title>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #171a24; font-family: 'Geist', system-ui, sans-serif; }
    svg#d { width: 1200px; height: 675px; display: block; }
  </style>
</head>
<body>
  <svg id="d" viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg"
       role="img" aria-labelledby="qr-title qr-desc">
    <title id="qr-title">QR lead-capture flow</title>
    <desc id="qr-desc">A scanned business card posts to a form webhook, which upserts the prospect into GoHighLevel, assigns the owning broker through a routing guard, and normalises the phone number to E.164. The welcome email is sent from the verified domain with the owning broker as Reply-To, so replies reach the broker without breaking SPF, DKIM or DMARC alignment.</desc>

    <defs>
      <marker id="arrow" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto"><polygon points="0 0, 6 2.5, 0 5" fill="#9aa4bd"/></marker>
      <marker id="arrow-accent" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto"><polygon points="0 0, 6 2.5, 0 5" fill="#ea4b71"/></marker>
      <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="rgba(232,236,245,0.07)"/></pattern>
    </defs>

    <rect width="100%" height="100%" fill="#171a24"/>
    <rect width="100%" height="100%" fill="url(#dots)"/>

    <!-- header -->
    <text x="56" y="84" fill="#7f8aa5" font-size="13" font-family="'Geist Mono', monospace" letter-spacing="0.14em">QR LEAD CAPTURE · A SCAN BECOMES A ROUTED CONTACT</text>
    <line x1="56" y1="104" x2="1144" y2="104" stroke="rgba(232,236,245,0.10)" stroke-width="1"/>

    <!-- wires -->
    <g fill="none" stroke="#9aa4bd" stroke-width="2.4">
      <path d="M280,212 H336" marker-end="url(#arrow)"/>
      <path d="M568,212 H624" marker-end="url(#arrow)"/>
      <path d="M856,212 H912" marker-end="url(#arrow)"/>
      <path d="M1032,264 V400 H892" marker-end="url(#arrow-accent)" stroke="#ea4b71"/>
    </g>
    <text x="1050" y="332" fill="#7f8aa5" font-size="13" font-family="'Geist Mono', monospace" letter-spacing="0.08em">SEND</text>

    <!-- row 1 -->
    <rect x="56" y="160" width="224" height="104" rx="52" fill="#171a24"/>
    <rect x="56" y="160" width="224" height="104" rx="52" fill="rgba(52,211,153,0.06)" stroke="#34d399" stroke-width="1.4"/>
    <circle cx="168" cy="182" r="6" fill="#34d399"/>
    <text x="168" y="218" fill="#e8ecf5" font-size="24" font-weight="600" text-anchor="middle">Card scanned</text>
    <text x="168" y="242" fill="#9aa4bd" font-size="15" font-family="'Geist Mono', monospace" text-anchor="middle">QR form webhook</text>

    <rect x="344" y="160" width="224" height="104" rx="8" fill="#232838" stroke="#39415a" stroke-width="1.2"/>
    <circle cx="456" cy="182" r="6" fill="#c084fc"/>
    <text x="456" y="218" fill="#e8ecf5" font-size="24" font-weight="600" text-anchor="middle">Upsert prospect</text>
    <text x="456" y="242" fill="#9aa4bd" font-size="15" font-family="'Geist Mono', monospace" text-anchor="middle">GHL contacts</text>

    <rect x="632" y="160" width="224" height="104" rx="8" fill="#232838" stroke="#39415a" stroke-width="1.2"/>
    <circle cx="744" cy="182" r="6" fill="#818cf8"/>
    <text x="744" y="218" fill="#e8ecf5" font-size="24" font-weight="600" text-anchor="middle">Route to broker</text>
    <text x="744" y="242" fill="#9aa4bd" font-size="15" font-family="'Geist Mono', monospace" text-anchor="middle">owner guard</text>

    <rect x="920" y="160" width="224" height="104" rx="8" fill="#232838" stroke="#39415a" stroke-width="1.2"/>
    <circle cx="1032" cy="182" r="6" fill="#818cf8"/>
    <text x="1032" y="218" fill="#e8ecf5" font-size="24" font-weight="600" text-anchor="middle">Fix the phone</text>
    <text x="1032" y="242" fill="#9aa4bd" font-size="15" font-family="'Geist Mono', monospace" text-anchor="middle">E.164, in GHL</text>

    <!-- FOCAL -->
    <rect x="612" y="348" width="280" height="104" rx="8" fill="#171a24"/>
    <rect x="612" y="348" width="280" height="104" rx="8" fill="rgba(234,75,113,0.10)" stroke="#ea4b71" stroke-width="1.6"/>
    <circle cx="752" cy="370" r="6" fill="#ea4b71"/>
    <text x="752" y="406" fill="#ffffff" font-size="24" font-weight="600" text-anchor="middle">Welcome email</text>
    <text x="752" y="430" fill="#f3aec0" font-size="15" font-family="'Geist Mono', monospace" text-anchor="middle">verified sender</text>

    <!-- the headers it actually sends -->
    <rect x="612" y="492" width="532" height="96" rx="8" fill="rgba(232,236,245,0.02)" stroke="rgba(232,236,245,0.10)" stroke-width="1"/>
    <text x="636" y="520" fill="#7f8aa5" font-size="13" font-family="'Geist Mono', monospace" letter-spacing="0.14em">HEADERS</text>
    <text x="636" y="548" fill="#e8ecf5" font-size="16" font-family="'Geist Mono', monospace">From:     the verified domain</text>
    <text x="636" y="572" fill="#e8ecf5" font-size="16" font-family="'Geist Mono', monospace">Reply-To: the owning broker</text>

    <!-- why it lands -->
    <rect x="56" y="348" width="488" height="240" rx="10" fill="rgba(232,236,245,0.02)" stroke="rgba(232,236,245,0.10)" stroke-width="1"/>
    <text x="84" y="386" fill="#7f8aa5" font-size="13" font-family="'Geist Mono', monospace" letter-spacing="0.14em">WHY IT LANDS, NOT SPAM</text>
    <line x1="84" y1="402" x2="516" y2="402" stroke="rgba(232,236,245,0.08)" stroke-width="1"/>
    <circle cx="92" cy="434" r="5" fill="#ea4b71"/>
    <text x="110" y="440" fill="#e8ecf5" font-size="17" font-family="'Geist Mono', monospace">Sent from the one domain</text>
    <text x="110" y="462" fill="#e8ecf5" font-size="17" font-family="'Geist Mono', monospace">that SPF/DKIM/DMARC pass</text>
    <circle cx="92" cy="496" r="5" fill="#818cf8"/>
    <text x="110" y="502" fill="#e8ecf5" font-size="17" font-family="'Geist Mono', monospace">Reply-To carries the broker,</text>
    <text x="110" y="524" fill="#e8ecf5" font-size="17" font-family="'Geist Mono', monospace">so alignment survives</text>
    <circle cx="92" cy="558" r="5" fill="#34d399"/>
    <text x="110" y="564" fill="#e8ecf5" font-size="17" font-family="'Geist Mono', monospace">Zero manual triage</text>

    <!-- legend -->
    <line x1="56" y1="612" x2="1144" y2="612" stroke="rgba(232,236,245,0.12)" stroke-width="1"/>
    <text x="56" y="644" fill="#7f8aa5" font-size="13" font-family="'Geist Mono', monospace" letter-spacing="0.14em">N8N NODE</text>
    <circle cx="196" cy="639" r="6" fill="#34d399"/>
    <text x="212" y="644" fill="#9aa4bd" font-size="15" font-family="'Geist Mono', monospace">trigger</text>
    <circle cx="364" cy="639" r="6" fill="#c084fc"/>
    <text x="380" y="644" fill="#9aa4bd" font-size="15" font-family="'Geist Mono', monospace">http</text>
    <circle cx="500" cy="639" r="6" fill="#818cf8"/>
    <text x="516" y="644" fill="#9aa4bd" font-size="15" font-family="'Geist Mono', monospace">code</text>
    <circle cx="636" cy="639" r="6" fill="#ea4b71"/>
    <text x="652" y="644" fill="#9aa4bd" font-size="15" font-family="'Geist Mono', monospace">email</text>
  </svg>
</body>
</html>
