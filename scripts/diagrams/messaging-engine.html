<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Messaging engine</title>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #171a24; font-family: 'Geist', system-ui, sans-serif; }
    svg#d { width: 1200px; height: 675px; display: block; }
  </style>
</head>
<body>
  <svg id="d" viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg"
       role="img" aria-labelledby="msg-title msg-desc">
    <title id="msg-title">Messaging engine</title>
    <desc id="msg-desc">Any workflow can ask for a notification. The request is hashed and checked against what has already gone out, routed to one of thirteen message types, given copy either from a fixed template or from a language model, and sent as one WhatsApp template that is logged on the way out.</desc>

    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#9aa4bd"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#ea4b71"/></marker>
      <marker id="arrow-soft" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6b7590"/></marker>
      <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="rgba(232,236,245,0.07)"/></pattern>
    </defs>

    <rect width="100%" height="100%" fill="#171a24"/>
    <rect width="100%" height="100%" fill="url(#dots)"/>

    <!-- spine -->
    <line x1="208" y1="248" x2="252" y2="248" stroke="#9aa4bd" stroke-width="1.4" marker-end="url(#arrow)"/>
    <line x1="392" y1="248" x2="436" y2="248" stroke="#9aa4bd" stroke-width="1.4" marker-end="url(#arrow)"/>
    <line x1="576" y1="248" x2="620" y2="248" stroke="#9aa4bd" stroke-width="1.4" marker-end="url(#arrow)"/>

    <!-- the split: some types get written copy, the rest use a fixed template -->
    <path d="M760,232 a8,8 0 0 1 8,-8 H796 a8,8 0 0 1 8,-8 V160"
          fill="none" stroke="#9aa4bd" stroke-width="1.4" marker-end="url(#arrow)"/>
    <path d="M944,128 H988 a8,8 0 0 1 8,8 V216"
          fill="none" stroke="#ea4b71" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <path d="M760,264 a8,8 0 0 0 8,8 H980 a8,8 0 0 0 8,8 V216"
          fill="none" stroke="#9aa4bd" stroke-width="1.4" marker-end="url(#arrow)"/>

    <rect x="800" y="292" width="88" height="14" rx="2" fill="#171a24"/>
    <text x="804" y="303" fill="#7f8aa5" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.08em">FIXED TEMPLATE</text>

    <!-- already-sent exit -->
    <path d="M508,292 V392 a8,8 0 0 0 8,8 H352 a8,8 0 0 0 -8,8 V440"
          fill="none" stroke="#6b7590" stroke-width="1.2" marker-end="url(#arrow-soft)"/>
    <rect x="520" y="332" width="72" height="14" rx="2" fill="#171a24"/>
    <text x="524" y="343" fill="#7f8aa5" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.08em">SAME HASH</text>

    <!-- 1. request -->
    <rect x="72" y="216" width="136" height="64" rx="32" fill="#171a24"/>
    <rect x="72" y="216" width="136" height="64" rx="32" fill="rgba(52,211,153,0.06)" stroke="#34d399" stroke-width="1"/>
    <circle cx="140" cy="232" r="4" fill="#34d399"/>
    <text x="140" y="256" fill="#e8ecf5" font-size="12" font-weight="600" text-anchor="middle">Event fires</text>
    <text x="140" y="270" fill="#9aa4bd" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">from any workflow</text>

    <!-- 2. hash -->
    <rect x="256" y="216" width="136" height="64" rx="6" fill="#171a24"/>
    <rect x="256" y="216" width="136" height="64" rx="6" fill="#232838" stroke="#39415a" stroke-width="1"/>
    <circle cx="324" cy="232" r="4" fill="#818cf8"/>
    <text x="324" y="256" fill="#e8ecf5" font-size="12" font-weight="600" text-anchor="middle">Hash the message</text>
    <text x="324" y="270" fill="#9aa4bd" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">contents, not time</text>

    <!-- 3. dedupe gate -->
    <polygon points="508,200 576,248 508,296 440,248" fill="#171a24"/>
    <polygon points="508,200 576,248 508,296 440,248" fill="#232838" stroke="#39415a" stroke-width="1"/>
    <circle cx="508" cy="224" r="4" fill="#c084fc"/>
    <text x="508" y="256" fill="#e8ecf5" font-size="12" font-weight="600" text-anchor="middle">Sent already?</text>

    <!-- 4. route -->
    <rect x="624" y="216" width="136" height="64" rx="6" fill="#171a24"/>
    <rect x="624" y="216" width="136" height="64" rx="6" fill="#232838" stroke="#39415a" stroke-width="1"/>
    <circle cx="692" cy="232" r="4" fill="#fbbf24"/>
    <text x="692" y="256" fill="#e8ecf5" font-size="12" font-weight="600" text-anchor="middle">Route by kind</text>
    <text x="692" y="270" fill="#9aa4bd" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">13 of them</text>

    <!-- 5. generated copy (upper branch) -->
    <rect x="808" y="96" width="136" height="64" rx="6" fill="#171a24"/>
    <rect x="808" y="96" width="136" height="64" rx="6" fill="#232838" stroke="#39415a" stroke-width="1"/>
    <circle cx="876" cy="112" r="4" fill="#22d3ee"/>
    <text x="876" y="136" fill="#e8ecf5" font-size="12" font-weight="600" text-anchor="middle">Write the copy</text>
    <text x="876" y="150" fill="#9aa4bd" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">coaching, milestones</text>

    <!-- 6. FOCAL — one way out, so nothing can send twice -->
    <rect x="992" y="216" width="136" height="64" rx="6" fill="#171a24"/>
    <rect x="992" y="216" width="136" height="64" rx="6" fill="rgba(234,75,113,0.10)" stroke="#ea4b71" stroke-width="1.2"/>
    <circle cx="1060" cy="232" r="4" fill="#c084fc"/>
    <text x="1060" y="256" fill="#ffffff" font-size="12" font-weight="600" text-anchor="middle">Send and log</text>
    <text x="1060" y="270" fill="#f3aec0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">one way out</text>

    <!-- skipped -->
    <rect x="264" y="440" width="160" height="56" rx="28" fill="#171a24"/>
    <rect x="264" y="440" width="160" height="56" rx="28" fill="rgba(154,164,189,0.06)" stroke="#6b7590" stroke-width="1"/>
    <text x="344" y="466" fill="#c8cfdf" font-size="12" font-weight="600" text-anchor="middle">Skipped</text>
    <text x="344" y="480" fill="#7f8aa5" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">no second copy</text>

    <!-- legend -->
    <line x1="72" y1="560" x2="1128" y2="560" stroke="rgba(232,236,245,0.12)" stroke-width="0.8"/>
    <text x="72" y="584" fill="#7f8aa5" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">N8N NODE</text>
    <circle cx="216" cy="580" r="4" fill="#34d399"/>
    <text x="228" y="584" fill="#9aa4bd" font-size="9" font-family="'Geist Mono', monospace">trigger</text>
    <circle cx="352" cy="580" r="4" fill="#818cf8"/>
    <text x="364" y="584" fill="#9aa4bd" font-size="9" font-family="'Geist Mono', monospace">code</text>
    <circle cx="464" cy="580" r="4" fill="#fbbf24"/>
    <text x="476" y="584" fill="#9aa4bd" font-size="9" font-family="'Geist Mono', monospace">switch</text>
    <circle cx="592" cy="580" r="4" fill="#22d3ee"/>
    <text x="604" y="584" fill="#9aa4bd" font-size="9" font-family="'Geist Mono', monospace">model</text>
    <circle cx="704" cy="580" r="4" fill="#c084fc"/>
    <text x="716" y="584" fill="#9aa4bd" font-size="9" font-family="'Geist Mono', monospace">http · database</text>
  </svg>
</body>
</html>
