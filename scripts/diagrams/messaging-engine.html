<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Messaging engine</title>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #171a24; font-family: 'Geist', system-ui, sans-serif; }
    svg#d { width: 1200px; height: 675px; display: block; }
  </style>
</head>
<body>
  <svg id="d" viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg"
       role="img" aria-labelledby="msg-title msg-desc">
    <title id="msg-title">One messaging engine for thirteen message kinds</title>
    <desc id="msg-desc">Any workflow can raise a message event. The engine hashes the message contents, not the time it was raised, so the same message raised twice is skipped rather than sent twice. What is new is routed to one of thirteen kinds, written by a model where the copy is coaching and taken from a fixed template where it is not, and every send leaves the system through one logged exit.</desc>

    <defs>
      <marker id="arrow" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto"><polygon points="0 0, 6 2.5, 0 5" fill="#9aa4bd"/></marker>
      <marker id="arrow-accent" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto"><polygon points="0 0, 6 2.5, 0 5" fill="#ea4b71"/></marker>
      <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="rgba(232,236,245,0.07)"/></pattern>
    </defs>

    <rect width="100%" height="100%" fill="#171a24"/>
    <rect width="100%" height="100%" fill="url(#dots)"/>

    <!-- header -->
    <text x="56" y="84" fill="#7f8aa5" font-size="13" font-family="'Geist Mono', monospace" letter-spacing="0.14em">MESSAGING ENGINE · 13 KINDS, ONE WAY OUT</text>
    <line x1="56" y1="104" x2="1144" y2="104" stroke="rgba(232,236,245,0.10)" stroke-width="1"/>

    <!-- wires -->
    <g fill="none" stroke="#9aa4bd" stroke-width="2.4">
      <path d="M280,212 H336" marker-end="url(#arrow)"/>
      <path d="M568,212 H624" marker-end="url(#arrow)"/>
      <path d="M856,212 H912" marker-end="url(#arrow)"/>
      <path d="M744,264 V492" marker-end="url(#arrow)"/>
    </g>
    <path d="M1032,264 V340" fill="none" stroke="#ea4b71" stroke-width="2.4" marker-end="url(#arrow-accent)"/>
    <text x="884" y="196" fill="#7f8aa5" font-size="13" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NEW</text>
    <text x="762" y="396" fill="#7f8aa5" font-size="13" font-family="'Geist Mono', monospace" letter-spacing="0.08em">SAME HASH</text>

    <!-- row 1 -->
    <rect x="56" y="160" width="224" height="104" rx="52" fill="#171a24"/>
    <rect x="56" y="160" width="224" height="104" rx="52" fill="rgba(52,211,153,0.06)" stroke="#34d399" stroke-width="1.4"/>
    <circle cx="168" cy="182" r="6" fill="#34d399"/>
    <text x="168" y="218" fill="#e8ecf5" font-size="24" font-weight="600" text-anchor="middle">Event fires</text>
    <text x="168" y="242" fill="#9aa4bd" font-size="15" font-family="'Geist Mono', monospace" text-anchor="middle">from any workflow</text>

    <rect x="344" y="160" width="224" height="104" rx="8" fill="#232838" stroke="#39415a" stroke-width="1.2"/>
    <circle cx="456" cy="182" r="6" fill="#818cf8"/>
    <text x="456" y="218" fill="#e8ecf5" font-size="24" font-weight="600" text-anchor="middle">Hash the copy</text>
    <text x="456" y="242" fill="#9aa4bd" font-size="15" font-family="'Geist Mono', monospace" text-anchor="middle">contents, not time</text>

    <path d="M632,212 L744,160 L856,212 L744,264 Z" fill="#232838" stroke="#39415a" stroke-width="1.2"/>
    <circle cx="744" cy="186" r="6" fill="#fbbf24"/>
    <text x="744" y="224" fill="#e8ecf5" font-size="22" font-weight="600" text-anchor="middle">Sent already?</text>

    <rect x="920" y="160" width="224" height="104" rx="8" fill="#232838" stroke="#39415a" stroke-width="1.2"/>
    <circle cx="1032" cy="182" r="6" fill="#fbbf24"/>
    <text x="1032" y="218" fill="#e8ecf5" font-size="24" font-weight="600" text-anchor="middle">Route by kind</text>
    <text x="1032" y="242" fill="#9aa4bd" font-size="15" font-family="'Geist Mono', monospace" text-anchor="middle">13 of them</text>

    <!-- FOCAL: the one exit -->
    <rect x="864" y="348" width="280" height="104" rx="8" fill="#171a24"/>
    <rect x="864" y="348" width="280" height="104" rx="8" fill="rgba(234,75,113,0.10)" stroke="#ea4b71" stroke-width="1.6"/>
    <circle cx="1004" cy="370" r="6" fill="#ea4b71"/>
    <text x="1004" y="406" fill="#ffffff" font-size="24" font-weight="600" text-anchor="middle">Send and log</text>
    <text x="1004" y="430" fill="#f3aec0" font-size="15" font-family="'Geist Mono', monospace" text-anchor="middle">one way out</text>

    <!-- terminal -->
    <rect x="604" y="496" width="280" height="88" rx="44" fill="#1d2130" stroke="#39415a" stroke-width="1.2"/>
    <text x="744" y="536" fill="#e8ecf5" font-size="24" font-weight="600" text-anchor="middle">Skipped</text>
    <text x="744" y="560" fill="#9aa4bd" font-size="15" font-family="'Geist Mono', monospace" text-anchor="middle">no second copy</text>

    <!-- how the copy is chosen -->
    <rect x="56" y="348" width="488" height="240" rx="10" fill="rgba(232,236,245,0.02)" stroke="rgba(232,236,245,0.10)" stroke-width="1"/>
    <text x="84" y="386" fill="#7f8aa5" font-size="13" font-family="'Geist Mono', monospace" letter-spacing="0.14em">WHERE THE COPY COMES FROM</text>
    <line x1="84" y1="402" x2="516" y2="402" stroke="rgba(232,236,245,0.08)" stroke-width="1"/>
    <circle cx="92" cy="434" r="5" fill="#22d3ee"/>
    <text x="110" y="440" fill="#e8ecf5" font-size="17" font-family="'Geist Mono', monospace">Written by a model when</text>
    <text x="110" y="462" fill="#e8ecf5" font-size="17" font-family="'Geist Mono', monospace">it is coaching or a milestone</text>
    <circle cx="92" cy="496" r="5" fill="#818cf8"/>
    <text x="110" y="502" fill="#e8ecf5" font-size="17" font-family="'Geist Mono', monospace">A fixed template when the</text>
    <text x="110" y="524" fill="#e8ecf5" font-size="17" font-family="'Geist Mono', monospace">wording must not vary</text>
    <circle cx="92" cy="558" r="5" fill="#ea4b71"/>
    <text x="110" y="564" fill="#e8ecf5" font-size="17" font-family="'Geist Mono', monospace">Either way, one logged exit</text>

    <!-- legend -->
    <line x1="56" y1="612" x2="1144" y2="612" stroke="rgba(232,236,245,0.12)" stroke-width="1"/>
    <text x="56" y="644" fill="#7f8aa5" font-size="13" font-family="'Geist Mono', monospace" letter-spacing="0.14em">N8N NODE</text>
    <circle cx="196" cy="639" r="6" fill="#34d399"/>
    <text x="212" y="644" fill="#9aa4bd" font-size="15" font-family="'Geist Mono', monospace">trigger</text>
    <circle cx="364" cy="639" r="6" fill="#818cf8"/>
    <text x="380" y="644" fill="#9aa4bd" font-size="15" font-family="'Geist Mono', monospace">code</text>
    <circle cx="500" cy="639" r="6" fill="#fbbf24"/>
    <text x="516" y="644" fill="#9aa4bd" font-size="15" font-family="'Geist Mono', monospace">switch</text>
    <circle cx="652" cy="639" r="6" fill="#22d3ee"/>
    <text x="668" y="644" fill="#9aa4bd" font-size="15" font-family="'Geist Mono', monospace">model</text>
    <circle cx="796" cy="639" r="6" fill="#ea4b71"/>
    <text x="812" y="644" fill="#9aa4bd" font-size="15" font-family="'Geist Mono', monospace">http · database</text>
  </svg>
</body>
</html>
