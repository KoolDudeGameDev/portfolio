<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Broker routing</title>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #171a24; font-family: 'Geist', system-ui, sans-serif; }
    svg#d { width: 1200px; height: 675px; display: block; }
  </style>
</head>
<body>
  <svg id="d" viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg"
       role="img" aria-labelledby="br-title br-desc">
    <title id="br-title">Broker routing and ownership</title>
    <desc id="br-desc">When a new client appears in GoHighLevel the workflow fetches the opportunity, maps it back to the broker who originated it, and sets that broker as owner, tag and follower in one step. The notification only fires the first time a broker is assigned, so an opportunity that moves through later stages does not email the same broker again.</desc>

    <defs>
      <marker id="arrow" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto"><polygon points="0 0, 6 2.5, 0 5" fill="#9aa4bd"/></marker>
      <marker id="arrow-accent" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto"><polygon points="0 0, 6 2.5, 0 5" fill="#ea4b71"/></marker>
      <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="rgba(232,236,245,0.07)"/></pattern>
    </defs>

    <rect width="100%" height="100%" fill="#171a24"/>
    <rect width="100%" height="100%" fill="url(#dots)"/>

    <!-- header -->
    <text x="56" y="84" fill="#7f8aa5" font-size="13" font-family="'Geist Mono', monospace" letter-spacing="0.14em">BROKER ROUTING · THE EMAIL FIRES ONCE, NOT PER UPDATE</text>
    <line x1="56" y1="104" x2="1144" y2="104" stroke="rgba(232,236,245,0.10)" stroke-width="1"/>

    <!-- wires -->
    <g fill="none" stroke="#9aa4bd" stroke-width="2.4">
      <path d="M280,212 H336" marker-end="url(#arrow)"/>
      <path d="M568,212 H624" marker-end="url(#arrow)"/>
      <path d="M856,212 H912" marker-end="url(#arrow)"/>
      <path d="M1032,264 V340" marker-end="url(#arrow)"/>
      <path d="M1032,452 V544 H884" marker-end="url(#arrow)"/>
    </g>
    <path d="M920,400 H884" fill="none" stroke="#ea4b71" stroke-width="2.4" marker-end="url(#arrow-accent)"/>
    <text x="902" y="380" fill="#7f8aa5" font-size="13" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">YES</text>
    <text x="1020" y="502" fill="#7f8aa5" font-size="13" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.08em">SAME BROKER</text>

    <!-- row 1 -->
    <rect x="56" y="160" width="224" height="104" rx="52" fill="#171a24"/>
    <rect x="56" y="160" width="224" height="104" rx="52" fill="rgba(52,211,153,0.06)" stroke="#34d399" stroke-width="1.4"/>
    <circle cx="168" cy="182" r="6" fill="#34d399"/>
    <text x="168" y="218" fill="#e8ecf5" font-size="24" font-weight="600" text-anchor="middle">New client</text>
    <text x="168" y="242" fill="#9aa4bd" font-size="15" font-family="'Geist Mono', monospace" text-anchor="middle">GHL webhook</text>

    <rect x="344" y="160" width="224" height="104" rx="8" fill="#232838" stroke="#39415a" stroke-width="1.2"/>
    <circle cx="456" cy="182" r="6" fill="#c084fc"/>
    <text x="456" y="218" fill="#e8ecf5" font-size="24" font-weight="600" text-anchor="middle">Fetch the deal</text>
    <text x="456" y="242" fill="#9aa4bd" font-size="15" font-family="'Geist Mono', monospace" text-anchor="middle">GHL v2 API</text>

    <rect x="632" y="160" width="224" height="104" rx="8" fill="#232838" stroke="#39415a" stroke-width="1.2"/>
    <circle cx="744" cy="182" r="6" fill="#818cf8"/>
    <text x="744" y="218" fill="#e8ecf5" font-size="24" font-weight="600" text-anchor="middle">Map the broker</text>
    <text x="744" y="242" fill="#9aa4bd" font-size="15" font-family="'Geist Mono', monospace" text-anchor="middle">originating BDA</text>

    <rect x="920" y="160" width="224" height="104" rx="8" fill="#232838" stroke="#39415a" stroke-width="1.2"/>
    <circle cx="1032" cy="182" r="6" fill="#c084fc"/>
    <text x="1032" y="218" fill="#e8ecf5" font-size="24" font-weight="600" text-anchor="middle">Own + follow</text>
    <text x="1032" y="242" fill="#9aa4bd" font-size="14" font-family="'Geist Mono', monospace" text-anchor="middle">owner · tag · follower</text>

    <!-- gate -->
    <path d="M920,400 L1032,340 L1144,400 L1032,452 Z" fill="#232838" stroke="#39415a" stroke-width="1.2"/>
    <circle cx="1032" cy="374" r="6" fill="#fbbf24"/>
    <text x="1032" y="412" fill="#e8ecf5" font-size="20" font-weight="600" text-anchor="middle">Newly assigned?</text>

    <!-- FOCAL -->
    <rect x="604" y="348" width="280" height="104" rx="8" fill="#171a24"/>
    <rect x="604" y="348" width="280" height="104" rx="8" fill="rgba(234,75,113,0.10)" stroke="#ea4b71" stroke-width="1.6"/>
    <circle cx="744" cy="370" r="6" fill="#ea4b71"/>
    <text x="744" y="406" fill="#ffffff" font-size="24" font-weight="600" text-anchor="middle">Email the broker</text>
    <text x="744" y="430" fill="#f3aec0" font-size="15" font-family="'Geist Mono', monospace" text-anchor="middle">once, on assignment</text>

    <!-- terminal -->
    <rect x="604" y="500" width="280" height="88" rx="44" fill="#1d2130" stroke="#39415a" stroke-width="1.2"/>
    <text x="744" y="540" fill="#e8ecf5" font-size="24" font-weight="600" text-anchor="middle">Done</text>
    <text x="744" y="564" fill="#9aa4bd" font-size="15" font-family="'Geist Mono', monospace" text-anchor="middle">no repeat email</text>

    <!-- what it guarantees -->
    <rect x="56" y="348" width="488" height="240" rx="10" fill="rgba(232,236,245,0.02)" stroke="rgba(232,236,245,0.10)" stroke-width="1"/>
    <text x="84" y="386" fill="#7f8aa5" font-size="13" font-family="'Geist Mono', monospace" letter-spacing="0.14em">WHAT THIS GUARANTEES</text>
    <line x1="84" y1="402" x2="516" y2="402" stroke="rgba(232,236,245,0.08)" stroke-width="1"/>
    <circle cx="92" cy="434" r="5" fill="#818cf8"/>
    <text x="110" y="440" fill="#e8ecf5" font-size="17" font-family="'Geist Mono', monospace">Owner is the originating</text>
    <text x="110" y="462" fill="#e8ecf5" font-size="17" font-family="'Geist Mono', monospace">broker, not the last toucher</text>
    <circle cx="92" cy="496" r="5" fill="#818cf8"/>
    <text x="110" y="502" fill="#e8ecf5" font-size="17" font-family="'Geist Mono', monospace">Follower, so a broker sees</text>
    <text x="110" y="524" fill="#e8ecf5" font-size="17" font-family="'Geist Mono', monospace">only their own clients</text>
    <circle cx="92" cy="558" r="5" fill="#ea4b71"/>
    <text x="110" y="564" fill="#e8ecf5" font-size="17" font-family="'Geist Mono', monospace">One email per assignment</text>

    <!-- legend -->
    <line x1="56" y1="612" x2="1144" y2="612" stroke="rgba(232,236,245,0.12)" stroke-width="1"/>
    <text x="56" y="644" fill="#7f8aa5" font-size="13" font-family="'Geist Mono', monospace" letter-spacing="0.14em">N8N NODE</text>
    <circle cx="196" cy="639" r="6" fill="#34d399"/>
    <text x="212" y="644" fill="#9aa4bd" font-size="15" font-family="'Geist Mono', monospace">trigger</text>
    <circle cx="364" cy="639" r="6" fill="#c084fc"/>
    <text x="380" y="644" fill="#9aa4bd" font-size="15" font-family="'Geist Mono', monospace">http</text>
    <circle cx="500" cy="639" r="6" fill="#818cf8"/>
    <text x="516" y="644" fill="#9aa4bd" font-size="15" font-family="'Geist Mono', monospace">code</text>
    <circle cx="636" cy="639" r="6" fill="#fbbf24"/>
    <text x="652" y="644" fill="#9aa4bd" font-size="15" font-family="'Geist Mono', monospace">if</text>
    <circle cx="752" cy="639" r="6" fill="#ea4b71"/>
    <text x="768" y="644" fill="#9aa4bd" font-size="15" font-family="'Geist Mono', monospace">email</text>
  </svg>
</body>
</html>
