<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Leave intake</title>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #171a24; font-family: 'Geist', system-ui, sans-serif; }
    svg#d { width: 1200px; height: 675px; display: block; }
  </style>
</head>
<body>
  <svg id="d" viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg"
       role="img" aria-labelledby="leave-title leave-desc">
    <title id="leave-title">Leave intake without a second policy engine</title>
    <desc id="leave-desc">Staff sign in with an employee ID and a one-time code sent to the address already on their record, so nobody can direct a code to an address they chose. The balance is then computed once, in SQL, against the HR application's own accrual engine, which is what stops the two systems quoting different numbers for the same person. Leave spanning a quarter boundary is charged day by day to the quarter it falls in, and the paid and unpaid split is shown before anyone submits.</desc>

    <defs>
      <marker id="arrow" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto"><polygon points="0 0, 6 2.5, 0 5" fill="#9aa4bd"/></marker>
      <marker id="arrow-accent" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto"><polygon points="0 0, 6 2.5, 0 5" fill="#ea4b71"/></marker>
      <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="rgba(232,236,245,0.07)"/></pattern>
    </defs>

    <rect width="100%" height="100%" fill="#171a24"/>
    <rect width="100%" height="100%" fill="url(#dots)"/>

    <!-- header -->
    <text x="56" y="84" fill="#7f8aa5" font-size="13" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEAVE INTAKE · NO SECOND SYSTEM OF RECORD, NO SECOND POLICY ENGINE</text>
    <line x1="56" y1="104" x2="1144" y2="104" stroke="rgba(232,236,245,0.10)" stroke-width="1"/>

    <!-- wires -->
    <g fill="none" stroke="#9aa4bd" stroke-width="2.4">
      <path d="M280,212 H336" marker-end="url(#arrow)"/>
      <path d="M568,212 H624" marker-end="url(#arrow)"/>
    </g>
    <path d="M856,212 H912" fill="none" stroke="#ea4b71" stroke-width="2.4" marker-end="url(#arrow-accent)"/>
    <path d="M1032,264 V340" fill="none" stroke="#ea4b71" stroke-width="2.4" marker-end="url(#arrow-accent)"/>
    <path d="M864,400 H812" fill="none" stroke="#9aa4bd" stroke-width="2.4" marker-end="url(#arrow)"/>
    <path d="M688,452 V486" fill="none" stroke="#9aa4bd" stroke-width="2.4" marker-end="url(#arrow)"/>
    <text x="838" y="380" fill="#7f8aa5" font-size="13" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">FILE</text>

    <!-- row 1 -->
    <rect x="56" y="160" width="224" height="104" rx="52" fill="#171a24"/>
    <rect x="56" y="160" width="224" height="104" rx="52" fill="rgba(52,211,153,0.06)" stroke="#34d399" stroke-width="1.4"/>
    <circle cx="168" cy="182" r="6" fill="#34d399"/>
    <text x="168" y="218" fill="#e8ecf5" font-size="24" font-weight="600" text-anchor="middle">Employee ID</text>
    <text x="168" y="242" fill="#9aa4bd" font-size="15" font-family="'Geist Mono', monospace" text-anchor="middle">no login, no account</text>

    <rect x="344" y="160" width="224" height="104" rx="8" fill="#232838" stroke="#39415a" stroke-width="1.2"/>
    <circle cx="456" cy="182" r="6" fill="#f87171"/>
    <text x="456" y="218" fill="#e8ecf5" font-size="24" font-weight="600" text-anchor="middle">One-time code</text>
    <text x="456" y="242" fill="#9aa4bd" font-size="15" font-family="'Geist Mono', monospace" text-anchor="middle">to the address on file</text>

    <rect x="632" y="160" width="224" height="104" rx="8" fill="#232838" stroke="#39415a" stroke-width="1.2"/>
    <circle cx="744" cy="182" r="6" fill="#818cf8"/>
    <text x="744" y="218" fill="#e8ecf5" font-size="24" font-weight="600" text-anchor="middle">Session opens</text>
    <text x="744" y="242" fill="#9aa4bd" font-size="15" font-family="'Geist Mono', monospace" text-anchor="middle">code burned on use</text>

    <!-- FOCAL -->
    <rect x="920" y="160" width="224" height="104" rx="8" fill="#171a24"/>
    <rect x="920" y="160" width="224" height="104" rx="8" fill="rgba(234,75,113,0.10)" stroke="#ea4b71" stroke-width="1.6"/>
    <circle cx="1032" cy="182" r="6" fill="#ea4b71"/>
    <text x="1032" y="218" fill="#ffffff" font-size="24" font-weight="600" text-anchor="middle">Price it in SQL</text>
    <text x="1032" y="242" fill="#f3aec0" font-size="15" font-family="'Geist Mono', monospace" text-anchor="middle">the HR app's engine</text>

    <!-- shown before submit -->
    <rect x="864" y="348" width="280" height="104" rx="8" fill="#232838" stroke="#39415a" stroke-width="1.2"/>
    <circle cx="1004" cy="370" r="6" fill="#c084fc"/>
    <text x="1004" y="406" fill="#e8ecf5" font-size="24" font-weight="600" text-anchor="middle">Show the split</text>
    <text x="1004" y="430" fill="#9aa4bd" font-size="15" font-family="'Geist Mono', monospace" text-anchor="middle">paid / unpaid, per quarter</text>

    <!-- written -->
    <rect x="572" y="348" width="232" height="104" rx="8" fill="#232838" stroke="#39415a" stroke-width="1.2"/>
    <circle cx="688" cy="370" r="6" fill="#c084fc"/>
    <text x="688" y="406" fill="#e8ecf5" font-size="24" font-weight="600" text-anchor="middle">Request filed</text>
    <text x="688" y="430" fill="#9aa4bd" font-size="15" font-family="'Geist Mono', monospace" text-anchor="middle">its own schema</text>

    <!-- approval -->
    <rect x="572" y="492" width="232" height="88" rx="8" fill="#1d2130" stroke="#39415a" stroke-width="1.2"/>
    <circle cx="688" cy="514" r="6" fill="#f87171"/>
    <text x="688" y="546" fill="#e8ecf5" font-size="22" font-weight="600" text-anchor="middle">Approval opens</text>
    <text x="688" y="568" fill="#9aa4bd" font-size="15" font-family="'Geist Mono', monospace" text-anchor="middle">a page, not a decision</text>

    <!-- what it refuses to duplicate -->
    <rect x="56" y="348" width="488" height="232" rx="10" fill="rgba(232,236,245,0.02)" stroke="rgba(232,236,245,0.10)" stroke-width="1"/>
    <text x="84" y="386" fill="#7f8aa5" font-size="13" font-family="'Geist Mono', monospace" letter-spacing="0.14em">WHAT IT REFUSES TO DUPLICATE</text>
    <line x1="84" y1="402" x2="516" y2="402" stroke="rgba(232,236,245,0.08)" stroke-width="1"/>
    <circle cx="92" cy="434" r="5" fill="#ea4b71"/>
    <text x="110" y="440" fill="#e8ecf5" font-size="17" font-family="'Geist Mono', monospace">Balances are computed once, in</text>
    <text x="110" y="462" fill="#e8ecf5" font-size="17" font-family="'Geist Mono', monospace">SQL, by the HR app's own rules</text>
    <circle cx="92" cy="496" r="5" fill="#f87171"/>
    <text x="110" y="502" fill="#e8ecf5" font-size="17" font-family="'Geist Mono', monospace">Mail scanners prefetch links, so</text>
    <text x="110" y="524" fill="#e8ecf5" font-size="17" font-family="'Geist Mono', monospace">no decision happens on a GET</text>
    <circle cx="92" cy="558" r="5" fill="#818cf8"/>
    <text x="110" y="564" fill="#e8ecf5" font-size="17" font-family="'Geist Mono', monospace">No foreign keys into HR tables</text>

    <!-- legend -->
    <line x1="56" y1="612" x2="1144" y2="612" stroke="rgba(232,236,245,0.12)" stroke-width="1"/>
    <text x="56" y="644" fill="#7f8aa5" font-size="13" font-family="'Geist Mono', monospace" letter-spacing="0.14em">N8N NODE</text>
    <circle cx="196" cy="639" r="6" fill="#34d399"/>
    <text x="212" y="644" fill="#9aa4bd" font-size="15" font-family="'Geist Mono', monospace">served page</text>
    <circle cx="388" cy="639" r="6" fill="#f87171"/>
    <text x="404" y="644" fill="#9aa4bd" font-size="15" font-family="'Geist Mono', monospace">email</text>
    <circle cx="520" cy="639" r="6" fill="#818cf8"/>
    <text x="536" y="644" fill="#9aa4bd" font-size="15" font-family="'Geist Mono', monospace">code</text>
    <circle cx="644" cy="639" r="6" fill="#c084fc"/>
    <text x="660" y="644" fill="#9aa4bd" font-size="15" font-family="'Geist Mono', monospace">postgres</text>
    <circle cx="812" cy="639" r="6" fill="#ea4b71"/>
    <text x="828" y="644" fill="#9aa4bd" font-size="15" font-family="'Geist Mono', monospace">the one policy engine</text>
  </svg>
</body>
</html>
