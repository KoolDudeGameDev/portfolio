<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Stage sync</title>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #171a24; font-family: 'Geist', system-ui, sans-serif; }
    svg#d { width: 1200px; height: 675px; display: block; }
  </style>
</head>
<body>
  <svg id="d" viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg"
       role="img" aria-labelledby="sync-title sync-desc">
    <title id="sync-title">Bidirectional stage sync</title>
    <desc id="sync-desc">GoHighLevel and Asana each report stage changes. Before either side writes, it reads where the other side already is. If the record is already at that stage, the run stops, which is what ends the echo loop between the two systems.</desc>

    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#9aa4bd"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#ea4b71"/></marker>
      <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="rgba(232,236,245,0.07)"/></pattern>
    </defs>

    <rect width="100%" height="100%" fill="#171a24"/>
    <rect width="100%" height="100%" fill="url(#dots)"/>

    <!-- lanes -->
    <rect x="132" y="84" width="936" height="152" rx="10" fill="rgba(232,236,245,0.015)" stroke="rgba(232,236,245,0.10)" stroke-dasharray="4 4"/>
    <text x="150" y="104" fill="#7f8aa5" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">GHL → ASANA</text>
    <rect x="132" y="372" width="936" height="152" rx="10" fill="rgba(232,236,245,0.015)" stroke="rgba(232,236,245,0.10)" stroke-dasharray="4 4"/>
    <text x="150" y="392" fill="#7f8aa5" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">ASANA → GHL</text>

    <!-- lane A spine -->
    <line x1="300" y1="160" x2="344" y2="160" stroke="#9aa4bd" stroke-width="1.4" marker-end="url(#arrow)"/>
    <line x1="484" y1="160" x2="528" y2="160" stroke="#9aa4bd" stroke-width="1.4" marker-end="url(#arrow)"/>
    <line x1="668" y1="160" x2="712" y2="160" stroke="#9aa4bd" stroke-width="1.4" marker-end="url(#arrow)"/>
    <line x1="852" y1="160" x2="896" y2="160" stroke="#9aa4bd" stroke-width="1.4" marker-end="url(#arrow)"/>
    <!-- lane B spine -->
    <line x1="300" y1="448" x2="344" y2="448" stroke="#9aa4bd" stroke-width="1.4" marker-end="url(#arrow)"/>
    <line x1="484" y1="448" x2="528" y2="448" stroke="#9aa4bd" stroke-width="1.4" marker-end="url(#arrow)"/>
    <line x1="668" y1="448" x2="712" y2="448" stroke="#9aa4bd" stroke-width="1.4" marker-end="url(#arrow)"/>
    <line x1="852" y1="448" x2="896" y2="448" stroke="#9aa4bd" stroke-width="1.4" marker-end="url(#arrow)"/>

    <!-- both gates drain into the one stop -->
    <line x1="784" y1="208" x2="784" y2="272" stroke="#ea4b71" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <line x1="784" y1="400" x2="784" y2="336" stroke="#ea4b71" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <text x="796" y="246" fill="#7f8aa5" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.08em">ALREADY THERE</text>
    <text x="796" y="372" fill="#7f8aa5" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.08em">ALREADY THERE</text>
    <text x="860" y="150" fill="#7f8aa5" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.08em">NO</text>
    <text x="860" y="438" fill="#7f8aa5" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.08em">NO</text>

    <!-- A1 -->
    <rect x="164" y="128" width="136" height="64" rx="32" fill="#171a24"/>
    <rect x="164" y="128" width="136" height="64" rx="32" fill="rgba(52,211,153,0.06)" stroke="#34d399" stroke-width="1"/>
    <circle cx="232" cy="144" r="4" fill="#34d399"/>
    <text x="232" y="168" fill="#e8ecf5" font-size="12" font-weight="600" text-anchor="middle">Stage moves</text>
    <text x="232" y="182" fill="#9aa4bd" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">GHL webhook</text>
    <!-- A2 -->
    <rect x="348" y="128" width="136" height="64" rx="6" fill="#171a24"/>
    <rect x="348" y="128" width="136" height="64" rx="6" fill="#232838" stroke="#39415a" stroke-width="1"/>
    <circle cx="416" cy="144" r="4" fill="#c084fc"/>
    <text x="416" y="168" fill="#e8ecf5" font-size="12" font-weight="600" text-anchor="middle">Find its task</text>
    <text x="416" y="182" fill="#9aa4bd" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Asana API</text>
    <!-- A3 -->
    <rect x="532" y="128" width="136" height="64" rx="6" fill="#171a24"/>
    <rect x="532" y="128" width="136" height="64" rx="6" fill="#232838" stroke="#39415a" stroke-width="1"/>
    <circle cx="600" cy="144" r="4" fill="#c084fc"/>
    <text x="600" y="168" fill="#e8ecf5" font-size="12" font-weight="600" text-anchor="middle">Read where it is</text>
    <text x="600" y="182" fill="#9aa4bd" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">current section</text>
    <!-- A4 gate -->
    <polygon points="784,112 852,160 784,208 716,160" fill="#171a24"/>
    <polygon points="784,112 852,160 784,208 716,160" fill="#232838" stroke="#39415a" stroke-width="1"/>
    <circle cx="784" cy="136" r="4" fill="#fbbf24"/>
    <text x="784" y="168" fill="#e8ecf5" font-size="12" font-weight="600" text-anchor="middle">Same stage?</text>
    <!-- A5 -->
    <rect x="900" y="128" width="136" height="64" rx="6" fill="#171a24"/>
    <rect x="900" y="128" width="136" height="64" rx="6" fill="#232838" stroke="#39415a" stroke-width="1"/>
    <circle cx="968" cy="144" r="4" fill="#c084fc"/>
    <text x="968" y="168" fill="#e8ecf5" font-size="12" font-weight="600" text-anchor="middle">Move the task</text>
    <text x="968" y="182" fill="#9aa4bd" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">mapped section</text>

    <!-- B1 -->
    <rect x="164" y="416" width="136" height="64" rx="32" fill="#171a24"/>
    <rect x="164" y="416" width="136" height="64" rx="32" fill="rgba(52,211,153,0.06)" stroke="#34d399" stroke-width="1"/>
    <circle cx="232" cy="432" r="4" fill="#34d399"/>
    <text x="232" y="456" fill="#e8ecf5" font-size="12" font-weight="600" text-anchor="middle">Task moves</text>
    <text x="232" y="470" fill="#9aa4bd" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Asana webhook</text>
    <!-- B2 -->
    <rect x="348" y="416" width="136" height="64" rx="6" fill="#171a24"/>
    <rect x="348" y="416" width="136" height="64" rx="6" fill="#232838" stroke="#39415a" stroke-width="1"/>
    <circle cx="416" cy="432" r="4" fill="#818cf8"/>
    <text x="416" y="456" fill="#e8ecf5" font-size="12" font-weight="600" text-anchor="middle">Resolve the stage</text>
    <text x="416" y="470" fill="#9aa4bd" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">section → stage</text>
    <!-- B3 -->
    <rect x="532" y="416" width="136" height="64" rx="6" fill="#171a24"/>
    <rect x="532" y="416" width="136" height="64" rx="6" fill="#232838" stroke="#39415a" stroke-width="1"/>
    <circle cx="600" cy="432" r="4" fill="#c084fc"/>
    <text x="600" y="456" fill="#e8ecf5" font-size="12" font-weight="600" text-anchor="middle">Read where it is</text>
    <text x="600" y="470" fill="#9aa4bd" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">current stage</text>
    <!-- B4 gate -->
    <polygon points="784,400 852,448 784,496 716,448" fill="#171a24"/>
    <polygon points="784,400 852,448 784,496 716,448" fill="#232838" stroke="#39415a" stroke-width="1"/>
    <circle cx="784" cy="424" r="4" fill="#fbbf24"/>
    <text x="784" y="456" fill="#e8ecf5" font-size="12" font-weight="600" text-anchor="middle">Same stage?</text>
    <!-- B5 -->
    <rect x="900" y="416" width="136" height="64" rx="6" fill="#171a24"/>
    <rect x="900" y="416" width="136" height="64" rx="6" fill="#232838" stroke="#39415a" stroke-width="1"/>
    <circle cx="968" cy="432" r="4" fill="#c084fc"/>
    <text x="968" y="456" fill="#e8ecf5" font-size="12" font-weight="600" text-anchor="middle">Update GHL</text>
    <text x="968" y="470" fill="#9aa4bd" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">opportunity stage</text>

    <!-- FOCAL: the one stop both directions share -->
    <rect x="704" y="276" width="160" height="56" rx="28" fill="#171a24"/>
    <rect x="704" y="276" width="160" height="56" rx="28" fill="rgba(234,75,113,0.10)" stroke="#ea4b71" stroke-width="1.2"/>
    <text x="784" y="302" fill="#ffffff" font-size="12" font-weight="600" text-anchor="middle">Stop</text>
    <text x="784" y="316" fill="#f3aec0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">the echo ends here</text>

    <!-- legend -->
    <line x1="72" y1="572" x2="1128" y2="572" stroke="rgba(232,236,245,0.12)" stroke-width="0.8"/>
    <text x="72" y="596" fill="#7f8aa5" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">N8N NODE</text>
    <circle cx="216" cy="592" r="4" fill="#34d399"/>
    <text x="228" y="596" fill="#9aa4bd" font-size="9" font-family="'Geist Mono', monospace">trigger</text>
    <circle cx="352" cy="592" r="4" fill="#c084fc"/>
    <text x="364" y="596" fill="#9aa4bd" font-size="9" font-family="'Geist Mono', monospace">http</text>
    <circle cx="464" cy="592" r="4" fill="#818cf8"/>
    <text x="476" y="596" fill="#9aa4bd" font-size="9" font-family="'Geist Mono', monospace">code</text>
    <circle cx="576" cy="592" r="4" fill="#fbbf24"/>
    <text x="588" y="596" fill="#9aa4bd" font-size="9" font-family="'Geist Mono', monospace">if</text>
  </svg>
</body>
</html>
