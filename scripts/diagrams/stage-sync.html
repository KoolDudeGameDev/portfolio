<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Stage sync</title>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #171a24; font-family: 'Geist', system-ui, sans-serif; }
    svg#d { width: 1200px; height: 675px; display: block; }
  </style>
</head>
<body>
  <svg id="d" viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg"
       role="img" aria-labelledby="sync-title sync-desc">
    <title id="sync-title">Bidirectional stage sync</title>
    <desc id="sync-desc">GoHighLevel and Asana each report stage changes. Before either side writes, it reads where the other side already is. If the record is already at that stage, the run stops, which is what ends the echo loop between the two systems.</desc>

    <defs>
      <marker id="arrow" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto"><polygon points="0 0, 6 2.5, 0 5" fill="#9aa4bd"/></marker>
      <marker id="arrow-accent" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto"><polygon points="0 0, 6 2.5, 0 5" fill="#ea4b71"/></marker>
      <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="rgba(232,236,245,0.07)"/></pattern>
    </defs>

    <rect width="100%" height="100%" fill="#171a24"/>
    <rect width="100%" height="100%" fill="url(#dots)"/>

    <!-- header -->
    <text x="56" y="84" fill="#7f8aa5" font-size="13" font-family="'Geist Mono', monospace" letter-spacing="0.14em">BIDIRECTIONAL STAGE SYNC · THE ECHO ENDS IN THE MIDDLE</text>
    <line x1="56" y1="104" x2="1144" y2="104" stroke="rgba(232,236,245,0.10)" stroke-width="1"/>

    <!-- lanes -->
    <rect x="40" y="132" width="1120" height="168" rx="10" fill="rgba(232,236,245,0.015)" stroke="rgba(232,236,245,0.10)" stroke-dasharray="5 5"/>
    <text x="64" y="156" fill="#7f8aa5" font-size="13" font-family="'Geist Mono', monospace" letter-spacing="0.14em">GHL → ASANA</text>
    <rect x="40" y="404" width="1120" height="168" rx="10" fill="rgba(232,236,245,0.015)" stroke="rgba(232,236,245,0.10)" stroke-dasharray="5 5"/>
    <text x="64" y="428" fill="#7f8aa5" font-size="13" font-family="'Geist Mono', monospace" letter-spacing="0.14em">ASANA → GHL</text>

    <!-- lane A spine -->
    <g fill="none" stroke="#9aa4bd" stroke-width="2.4">
      <path d="M288,216 H340" marker-end="url(#arrow)"/>
      <path d="M568,216 H620" marker-end="url(#arrow)"/>
      <path d="M848,216 H896" marker-end="url(#arrow)"/>
    </g>
    <!-- lane B spine -->
    <g fill="none" stroke="#9aa4bd" stroke-width="2.4">
      <path d="M288,488 H340" marker-end="url(#arrow)"/>
      <path d="M568,488 H620" marker-end="url(#arrow)"/>
      <path d="M848,488 H896" marker-end="url(#arrow)"/>
    </g>

    <!-- both gates drain into the one stop -->
    <path d="M740,268 V300" fill="none" stroke="#ea4b71" stroke-width="2.4" marker-end="url(#arrow-accent)"/>
    <path d="M740,436 V404" fill="none" stroke="#ea4b71" stroke-width="2.4" marker-end="url(#arrow-accent)"/>
    <text x="760" y="292" fill="#7f8aa5" font-size="13" font-family="'Geist Mono', monospace" letter-spacing="0.08em">ALREADY THERE</text>
    <text x="760" y="424" fill="#7f8aa5" font-size="13" font-family="'Geist Mono', monospace" letter-spacing="0.08em">ALREADY THERE</text>
    <text x="856" y="200" fill="#7f8aa5" font-size="13" font-family="'Geist Mono', monospace" letter-spacing="0.08em">NO</text>
    <text x="856" y="472" fill="#7f8aa5" font-size="13" font-family="'Geist Mono', monospace" letter-spacing="0.08em">NO</text>

    <!-- lane A nodes -->
    <rect x="72" y="164" width="216" height="104" rx="52" fill="#171a24"/>
    <rect x="72" y="164" width="216" height="104" rx="52" fill="rgba(52,211,153,0.06)" stroke="#34d399" stroke-width="1.4"/>
    <circle cx="180" cy="186" r="6" fill="#34d399"/>
    <text x="180" y="222" fill="#e8ecf5" font-size="24" font-weight="600" text-anchor="middle">Stage moves</text>
    <text x="180" y="246" fill="#9aa4bd" font-size="15" font-family="'Geist Mono', monospace" text-anchor="middle">GHL webhook</text>

    <rect x="352" y="164" width="216" height="104" rx="8" fill="#232838" stroke="#39415a" stroke-width="1.2"/>
    <circle cx="460" cy="186" r="6" fill="#c084fc"/>
    <text x="460" y="222" fill="#e8ecf5" font-size="24" font-weight="600" text-anchor="middle">Read Asana</text>
    <text x="460" y="246" fill="#9aa4bd" font-size="15" font-family="'Geist Mono', monospace" text-anchor="middle">where the task sits</text>

    <path d="M632,216 L740,164 L848,216 L740,268 Z" fill="#232838" stroke="#39415a" stroke-width="1.2"/>
    <circle cx="740" cy="190" r="6" fill="#fbbf24"/>
    <text x="740" y="228" fill="#e8ecf5" font-size="24" font-weight="600" text-anchor="middle">Same stage?</text>

    <rect x="904" y="164" width="216" height="104" rx="8" fill="#232838" stroke="#39415a" stroke-width="1.2"/>
    <circle cx="1012" cy="186" r="6" fill="#c084fc"/>
    <text x="1012" y="222" fill="#e8ecf5" font-size="24" font-weight="600" text-anchor="middle">Move the task</text>
    <text x="1012" y="246" fill="#9aa4bd" font-size="15" font-family="'Geist Mono', monospace" text-anchor="middle">mapped section</text>

    <!-- lane B nodes -->
    <rect x="72" y="436" width="216" height="104" rx="52" fill="#171a24"/>
    <rect x="72" y="436" width="216" height="104" rx="52" fill="rgba(52,211,153,0.06)" stroke="#34d399" stroke-width="1.4"/>
    <circle cx="180" cy="458" r="6" fill="#34d399"/>
    <text x="180" y="494" fill="#e8ecf5" font-size="24" font-weight="600" text-anchor="middle">Task moves</text>
    <text x="180" y="518" fill="#9aa4bd" font-size="15" font-family="'Geist Mono', monospace" text-anchor="middle">Asana webhook</text>

    <rect x="352" y="436" width="216" height="104" rx="8" fill="#232838" stroke="#39415a" stroke-width="1.2"/>
    <circle cx="460" cy="458" r="6" fill="#c084fc"/>
    <text x="460" y="494" fill="#e8ecf5" font-size="24" font-weight="600" text-anchor="middle">Read GHL</text>
    <text x="460" y="518" fill="#9aa4bd" font-size="15" font-family="'Geist Mono', monospace" text-anchor="middle">where the deal sits</text>

    <path d="M632,488 L740,436 L848,488 L740,540 Z" fill="#232838" stroke="#39415a" stroke-width="1.2"/>
    <circle cx="740" cy="462" r="6" fill="#fbbf24"/>
    <text x="740" y="500" fill="#e8ecf5" font-size="24" font-weight="600" text-anchor="middle">Same stage?</text>

    <rect x="904" y="436" width="216" height="104" rx="8" fill="#232838" stroke="#39415a" stroke-width="1.2"/>
    <circle cx="1012" cy="458" r="6" fill="#c084fc"/>
    <text x="1012" y="494" fill="#e8ecf5" font-size="24" font-weight="600" text-anchor="middle">Update GHL</text>
    <text x="1012" y="518" fill="#9aa4bd" font-size="15" font-family="'Geist Mono', monospace" text-anchor="middle">opportunity stage</text>

    <!-- FOCAL: the one stop that ends the echo -->
    <rect x="624" y="308" width="232" height="88" rx="44" fill="#171a24"/>
    <rect x="624" y="308" width="232" height="88" rx="44" fill="rgba(234,75,113,0.10)" stroke="#ea4b71" stroke-width="1.6"/>
    <text x="740" y="348" fill="#ffffff" font-size="24" font-weight="600" text-anchor="middle">Stop</text>
    <text x="740" y="372" fill="#f3aec0" font-size="15" font-family="'Geist Mono', monospace" text-anchor="middle">the echo ends here</text>

    <!-- legend -->
    <line x1="56" y1="612" x2="1144" y2="612" stroke="rgba(232,236,245,0.12)" stroke-width="1"/>
    <text x="56" y="644" fill="#7f8aa5" font-size="13" font-family="'Geist Mono', monospace" letter-spacing="0.14em">N8N NODE</text>
    <circle cx="196" cy="639" r="6" fill="#34d399"/>
    <text x="212" y="644" fill="#9aa4bd" font-size="15" font-family="'Geist Mono', monospace">trigger</text>
    <circle cx="364" cy="639" r="6" fill="#c084fc"/>
    <text x="380" y="644" fill="#9aa4bd" font-size="15" font-family="'Geist Mono', monospace">http</text>
    <circle cx="500" cy="639" r="6" fill="#fbbf24"/>
    <text x="516" y="644" fill="#9aa4bd" font-size="15" font-family="'Geist Mono', monospace">if</text>
    <circle cx="616" cy="639" r="6" fill="#ea4b71"/>
    <text x="632" y="644" fill="#9aa4bd" font-size="15" font-family="'Geist Mono', monospace">stops the loop</text>
  </svg>
</body>
</html>
