<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>WhatsApp OTP login</title>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #171a24; font-family: 'Geist', system-ui, sans-serif; }
    svg#d { width: 1200px; height: 675px; display: block; }
  </style>
</head>
<body>
  <svg id="d" viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg"
       role="img" aria-labelledby="otp-title otp-desc">
    <title id="otp-title">WhatsApp one-time-code login</title>
    <desc id="otp-desc">A creator enters a phone number, an edge function asks WhatsApp to send a six-digit code in the chat thread they already use, and the code is verified server side. Only after it checks out does the edge function mint a magic-link token, which the login page exchanges for a genuine session from the auth provider. Email login is untouched: this is a second way into the same session, not a parallel one.</desc>

    <defs>
      <marker id="arrow" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto"><polygon points="0 0, 6 2.5, 0 5" fill="#9aa4bd"/></marker>
      <marker id="arrow-back" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto"><polygon points="0 0, 6 2.5, 0 5" fill="#9aa4bd"/></marker>
      <marker id="arrow-accent" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto"><polygon points="0 0, 6 2.5, 0 5" fill="#ea4b71"/></marker>
      <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="rgba(232,236,245,0.07)"/></pattern>
    </defs>

    <rect width="100%" height="100%" fill="#171a24"/>
    <rect width="100%" height="100%" fill="url(#dots)"/>

    <!-- header -->
    <text x="56" y="84" fill="#7f8aa5" font-size="13" font-family="'Geist Mono', monospace" letter-spacing="0.14em">WHATSAPP OTP LOGIN · THE CODE IS CHECKED BEFORE A TOKEN EXISTS</text>
    <line x1="56" y1="104" x2="1144" y2="104" stroke="rgba(232,236,245,0.10)" stroke-width="1"/>

    <!-- lifelines -->
    <g stroke="rgba(232,236,245,0.14)" stroke-width="1.4" stroke-dasharray="4 6">
      <line x1="202" y1="216" x2="202" y2="584"/>
      <line x1="414" y1="216" x2="414" y2="584"/>
      <line x1="626" y1="216" x2="626" y2="584"/>
      <line x1="838" y1="216" x2="838" y2="584"/>
      <line x1="1050" y1="216" x2="1050" y2="584"/>
    </g>

    <!-- actors -->
    <rect x="108" y="140" width="188" height="72" rx="36" fill="#171a24"/>
    <rect x="108" y="140" width="188" height="72" rx="36" fill="rgba(52,211,153,0.06)" stroke="#34d399" stroke-width="1.4"/>
    <text x="202" y="184" fill="#e8ecf5" font-size="22" font-weight="600" text-anchor="middle">Creator</text>

    <rect x="320" y="140" width="188" height="72" rx="8" fill="#232838" stroke="#39415a" stroke-width="1.2"/>
    <text x="414" y="184" fill="#e8ecf5" font-size="22" font-weight="600" text-anchor="middle">Login page</text>

    <rect x="532" y="140" width="188" height="72" rx="8" fill="#232838" stroke="#39415a" stroke-width="1.2"/>
    <text x="626" y="184" fill="#e8ecf5" font-size="22" font-weight="600" text-anchor="middle">Edge function</text>

    <rect x="744" y="140" width="188" height="72" rx="8" fill="#232838" stroke="#39415a" stroke-width="1.2"/>
    <text x="838" y="184" fill="#e8ecf5" font-size="22" font-weight="600" text-anchor="middle">WhatsApp</text>

    <rect x="956" y="140" width="188" height="72" rx="8" fill="#232838" stroke="#39415a" stroke-width="1.2"/>
    <text x="1050" y="184" fill="#e8ecf5" font-size="22" font-weight="600" text-anchor="middle">Auth provider</text>

    <!-- messages -->
    <g font-family="'Geist Mono', monospace" font-size="13" fill="#7f8aa5" letter-spacing="0.08em">
      <text x="56" y="265">01</text>
      <text x="56" y="305">02</text>
      <text x="56" y="345">03</text>
      <text x="56" y="385">04</text>
      <text x="56" y="425">05</text>
      <text x="56" y="465">06</text>
      <text x="56" y="505">07</text>
      <text x="56" y="545">08</text>
      <text x="56" y="585">09</text>
    </g>

    <g stroke="#9aa4bd" stroke-width="2" fill="none">
      <line x1="202" y1="260" x2="406" y2="260" marker-end="url(#arrow)"/>
      <line x1="414" y1="300" x2="618" y2="300" marker-end="url(#arrow)"/>
      <line x1="626" y1="340" x2="830" y2="340" marker-end="url(#arrow)"/>
      <line x1="838" y1="380" x2="210" y2="380" marker-end="url(#arrow)"/>
      <line x1="202" y1="420" x2="406" y2="420" marker-end="url(#arrow)"/>
      <line x1="414" y1="460" x2="618" y2="460" marker-end="url(#arrow)"/>
      <line x1="626" y1="540" x2="422" y2="540" marker-end="url(#arrow)"/>
      <line x1="414" y1="580" x2="1042" y2="580" marker-end="url(#arrow)"/>
    </g>
    <line x1="626" y1="500" x2="1042" y2="500" stroke="#ea4b71" stroke-width="2.4" marker-end="url(#arrow-accent)"/>

    <g font-family="'Geist Mono', monospace" font-size="16" fill="#9aa4bd" text-anchor="middle">
      <text x="308" y="248">phone number</text>
      <text x="520" y="288">request a code</text>
      <text x="732" y="328">send code template</text>
      <text x="520" y="368">6-digit code, in the chat they use</text>
      <text x="308" y="408">enters the code</text>
      <text x="520" y="448">verify it</text>
      <text x="838" y="488" fill="#f3aec0">checks out → mint a magic-link token</text>
      <text x="520" y="528">token hash</text>
      <text x="732" y="568">exchange token → genuine session</text>
    </g>

    <!-- legend -->
    <line x1="56" y1="612" x2="1144" y2="612" stroke="rgba(232,236,245,0.12)" stroke-width="1"/>
    <text x="56" y="644" fill="#7f8aa5" font-size="13" font-family="'Geist Mono', monospace" letter-spacing="0.14em">NOTE</text>
    <text x="140" y="644" fill="#9aa4bd" font-size="15" font-family="'Geist Mono', monospace">email login is untouched · same session, a second way in</text>
    <circle cx="800" cy="639" r="6" fill="#ea4b71"/>
    <text x="816" y="644" fill="#9aa4bd" font-size="15" font-family="'Geist Mono', monospace">the only step that mints a token</text>
  </svg>
</body>
</html>
