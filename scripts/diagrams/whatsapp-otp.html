<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>WhatsApp OTP login</title>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #171a24; font-family: 'Geist', system-ui, sans-serif; }
    svg#d { width: 1200px; height: 675px; display: block; }
    .msg { fill: #c8cfdf; font-size: 10px; font-family: 'Geist Mono', monospace; paint-order: stroke; stroke: #171a24; stroke-width: 5px; }
    .num { fill: #7f8aa5; font-size: 8px; font-family: 'Geist Mono', monospace; letter-spacing: 0.08em; }
  </style>
</head>
<body>
  <svg id="d" viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg"
       role="img" aria-labelledby="otp-title otp-desc">
    <title id="otp-title">WhatsApp one-time-code login</title>
    <desc id="otp-desc">The creator asks for a code, an edge function sends it over WhatsApp, and when the code checks out the function has the auth provider mint a magic-link token, which the page exchanges for a real session.</desc>

    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#9aa4bd"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#ea4b71"/></marker>
      <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="rgba(232,236,245,0.07)"/></pattern>
    </defs>

    <rect width="100%" height="100%" fill="#171a24"/>
    <rect width="100%" height="100%" fill="url(#dots)"/>

    <!-- lifelines -->
    <g stroke="rgba(232,236,245,0.16)" stroke-width="1" stroke-dasharray="3 4">
      <line x1="150" y1="116" x2="150" y2="560"/>
      <line x1="375" y1="116" x2="375" y2="560"/>
      <line x1="600" y1="116" x2="600" y2="560"/>
      <line x1="825" y1="116" x2="825" y2="560"/>
      <line x1="1050" y1="116" x2="1050" y2="560"/>
    </g>

    <!-- actors -->
    <g font-size="12" font-weight="600" text-anchor="middle">
      <rect x="80" y="72" width="140" height="44" rx="22" fill="rgba(52,211,153,0.06)" stroke="#34d399"/>
      <text x="150" y="99" fill="#e8ecf5">Creator</text>
      <rect x="305" y="72" width="140" height="44" rx="6" fill="#232838" stroke="#39415a"/>
      <text x="375" y="99" fill="#e8ecf5">Login page</text>
      <rect x="530" y="72" width="140" height="44" rx="6" fill="#232838" stroke="#39415a"/>
      <text x="600" y="99" fill="#e8ecf5">Edge function</text>
      <rect x="755" y="72" width="140" height="44" rx="6" fill="#232838" stroke="#39415a"/>
      <text x="825" y="99" fill="#e8ecf5">WhatsApp</text>
      <rect x="980" y="72" width="140" height="44" rx="6" fill="#232838" stroke="#39415a"/>
      <text x="1050" y="99" fill="#e8ecf5">Auth provider</text>
    </g>

    <!-- messages -->
    <g stroke="#9aa4bd" stroke-width="1.3" fill="none">
      <line x1="150" y1="160" x2="371" y2="160" marker-end="url(#arrow)"/>
      <line x1="375" y1="204" x2="596" y2="204" marker-end="url(#arrow)"/>
      <line x1="600" y1="248" x2="821" y2="248" marker-end="url(#arrow)"/>
      <line x1="825" y1="292" x2="154" y2="292" marker-end="url(#arrow)"/>
      <line x1="150" y1="336" x2="371" y2="336" marker-end="url(#arrow)"/>
      <line x1="375" y1="380" x2="596" y2="380" marker-end="url(#arrow)"/>
      <line x1="600" y1="468" x2="379" y2="468" marker-end="url(#arrow)"/>
      <line x1="375" y1="512" x2="1046" y2="512" marker-end="url(#arrow)"/>
    </g>
    <!-- FOCAL: the bridge from "code is right" to "real session" -->
    <line x1="600" y1="424" x2="1046" y2="424" stroke="#ea4b71" stroke-width="1.5" marker-end="url(#arrow-accent)"/>

    <text class="msg" x="262" y="153" text-anchor="middle">phone number</text>
    <text class="msg" x="487" y="197" text-anchor="middle">request a code</text>
    <text class="msg" x="712" y="241" text-anchor="middle">send code template</text>
    <text class="msg" x="487" y="285" text-anchor="middle">6-digit code, in the chat they already use</text>
    <text class="msg" x="262" y="329" text-anchor="middle">enters the code</text>
    <text class="msg" x="487" y="373" text-anchor="middle">verify it</text>
    <text class="msg" x="823" y="417" text-anchor="middle" style="fill:#f3aec0">code checks out → mint magic-link token (admin)</text>
    <text class="msg" x="487" y="461" text-anchor="middle">token hash</text>
    <text class="msg" x="712" y="505" text-anchor="middle">exchange token → genuine session</text>

    <g class="num">
      <text x="60" y="163">01</text><text x="60" y="207">02</text><text x="60" y="251">03</text>
      <text x="60" y="295">04</text><text x="60" y="339">05</text><text x="60" y="383">06</text>
      <text x="60" y="427">07</text><text x="60" y="471">08</text><text x="60" y="515">09</text>
    </g>

    <!-- footer -->
    <line x1="72" y1="596" x2="1128" y2="596" stroke="rgba(232,236,245,0.12)" stroke-width="0.8"/>
    <text x="72" y="620" fill="#7f8aa5" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">EMAIL LOGIN IS UNTOUCHED · SAME SESSION, SECOND WAY IN</text>
  </svg>
</body>
</html>
