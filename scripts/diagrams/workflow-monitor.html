<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Workflow monitor</title>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #171a24; font-family: 'Geist', system-ui, sans-serif; }
    svg#d { width: 1200px; height: 675px; display: block; }
  </style>
</head>
<body>
  <svg id="d" viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg"
       role="img" aria-labelledby="monitor-title monitor-desc">
    <title id="monitor-title">Workflow monitor: instant failures and an hourly status</title>
    <desc id="monitor-desc">Two lanes in one n8n workflow. The error lane fires when a watched workflow's run fails, checks whether that workflow is muted for the hour, and if not posts an alert to Discord. The status lane runs every hour, reads the previous hour's failed runs from the n8n API, builds a summary and always posts it, silently, so a missing hourly post means n8n itself is down.</desc>

    <defs>
      <marker id="arrow" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto"><polygon points="0 0, 6 2.5, 0 5" fill="#9aa4bd"/></marker>
      <marker id="arrow-accent" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto"><polygon points="0 0, 6 2.5, 0 5" fill="#ea4b71"/></marker>
      <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="rgba(232,236,245,0.07)"/></pattern>
    </defs>

    <rect width="100%" height="100%" fill="#171a24"/>
    <rect width="100%" height="100%" fill="url(#dots)"/>

    <!-- header -->
    <text x="56" y="84" fill="#7f8aa5" font-size="13" font-family="'Geist Mono', monospace" letter-spacing="0.14em">WORKFLOW MONITOR · FAILURES AT ONCE, STATUS EVERY HOUR</text>
    <line x1="56" y1="104" x2="1144" y2="104" stroke="rgba(232,236,245,0.10)" stroke-width="1"/>

    <!-- lanes -->
    <rect x="40" y="132" width="1120" height="168" rx="10" fill="rgba(232,236,245,0.015)" stroke="rgba(232,236,245,0.10)" stroke-dasharray="5 5"/>
    <text x="64" y="156" fill="#7f8aa5" font-size="13" font-family="'Geist Mono', monospace" letter-spacing="0.14em">ERROR LANE · INSTANT</text>
    <rect x="40" y="404" width="1120" height="168" rx="10" fill="rgba(232,236,245,0.015)" stroke="rgba(232,236,245,0.10)" stroke-dasharray="5 5"/>
    <text x="64" y="428" fill="#7f8aa5" font-size="13" font-family="'Geist Mono', monospace" letter-spacing="0.14em">STATUS LANE · EVERY HOUR</text>

    <!-- lane A spine -->
    <g fill="none" stroke="#9aa4bd" stroke-width="2.4">
      <path d="M288,216 H340" marker-end="url(#arrow)"/>
      <path d="M568,216 H620" marker-end="url(#arrow)"/>
      <path d="M848,216 H896" marker-end="url(#arrow)"/>
    </g>
    <text x="580" y="200" fill="#7f8aa5" font-size="13" font-family="'Geist Mono', monospace" letter-spacing="0.08em">NO</text>
    <!-- muted runs drop out here, but the hourly post still counts them -->
    <path d="M460,268 V332" fill="none" stroke="#9aa4bd" stroke-width="2.4" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
    <text x="480" y="318" fill="#7f8aa5" font-size="13" font-family="'Geist Mono', monospace" letter-spacing="0.08em">YES · SKIP, STILL COUNTED HOURLY</text>

    <!-- lane B spine -->
    <g fill="none" stroke="#9aa4bd" stroke-width="2.4">
      <path d="M288,488 H340" marker-end="url(#arrow)"/>
      <path d="M568,488 H620" marker-end="url(#arrow)"/>
    </g>
    <path d="M848,488 H896" fill="none" stroke="#ea4b71" stroke-width="2.4" marker-end="url(#arrow-accent)"/>

    <!-- lane A nodes -->
    <rect x="72" y="164" width="216" height="104" rx="52" fill="#171a24"/>
    <rect x="72" y="164" width="216" height="104" rx="52" fill="rgba(52,211,153,0.06)" stroke="#34d399" stroke-width="1.4"/>
    <circle cx="180" cy="186" r="6" fill="#34d399"/>
    <text x="180" y="222" fill="#e8ecf5" font-size="24" font-weight="600" text-anchor="middle">Run fails</text>
    <text x="180" y="246" fill="#9aa4bd" font-size="15" font-family="'Geist Mono', monospace" text-anchor="middle">error trigger</text>

    <path d="M352,216 L460,164 L568,216 L460,268 Z" fill="#232838" stroke="#39415a" stroke-width="1.2"/>
    <circle cx="460" cy="190" r="6" fill="#fbbf24"/>
    <text x="460" y="228" fill="#e8ecf5" font-size="24" font-weight="600" text-anchor="middle">Muted?</text>

    <rect x="632" y="164" width="216" height="104" rx="8" fill="#232838" stroke="#39415a" stroke-width="1.2"/>
    <circle cx="740" cy="186" r="6" fill="#818cf8"/>
    <text x="740" y="222" fill="#e8ecf5" font-size="24" font-weight="600" text-anchor="middle">Format alert</text>
    <text x="740" y="246" fill="#9aa4bd" font-size="15" font-family="'Geist Mono', monospace" text-anchor="middle">node · error · link</text>

    <rect x="904" y="164" width="216" height="104" rx="8" fill="#232838" stroke="#39415a" stroke-width="1.2"/>
    <circle cx="1012" cy="186" r="6" fill="#8b93a8"/>
    <text x="1012" y="222" fill="#e8ecf5" font-size="24" font-weight="600" text-anchor="middle">Post alert</text>
    <text x="1012" y="246" fill="#9aa4bd" font-size="15" font-family="'Geist Mono', monospace" text-anchor="middle">Discord · mute 1 h</text>

    <!-- lane B nodes -->
    <rect x="72" y="436" width="216" height="104" rx="52" fill="#171a24"/>
    <rect x="72" y="436" width="216" height="104" rx="52" fill="rgba(52,211,153,0.06)" stroke="#34d399" stroke-width="1.4"/>
    <circle cx="180" cy="458" r="6" fill="#34d399"/>
    <text x="180" y="494" fill="#e8ecf5" font-size="24" font-weight="600" text-anchor="middle">Every hour</text>
    <text x="180" y="518" fill="#9aa4bd" font-size="15" font-family="'Geist Mono', monospace" text-anchor="middle">on the hour</text>

    <rect x="352" y="436" width="216" height="104" rx="8" fill="#232838" stroke="#39415a" stroke-width="1.2"/>
    <circle cx="460" cy="458" r="6" fill="#c084fc"/>
    <text x="460" y="494" fill="#e8ecf5" font-size="24" font-weight="600" text-anchor="middle">Failed runs</text>
    <text x="460" y="518" fill="#9aa4bd" font-size="15" font-family="'Geist Mono', monospace" text-anchor="middle">n8n REST API</text>

    <rect x="632" y="436" width="216" height="104" rx="8" fill="#232838" stroke="#39415a" stroke-width="1.2"/>
    <circle cx="740" cy="458" r="6" fill="#818cf8"/>
    <text x="740" y="494" fill="#e8ecf5" font-size="24" font-weight="600" text-anchor="middle">Build status</text>
    <text x="740" y="518" fill="#9aa4bd" font-size="15" font-family="'Geist Mono', monospace" text-anchor="middle">last full hour</text>

    <!-- FOCAL: the post that always arrives, so its absence is the signal -->
    <rect x="904" y="436" width="216" height="104" rx="8" fill="#171a24"/>
    <rect x="904" y="436" width="216" height="104" rx="8" fill="rgba(234,75,113,0.10)" stroke="#ea4b71" stroke-width="1.6"/>
    <circle cx="1012" cy="458" r="6" fill="#ea4b71"/>
    <text x="1012" y="494" fill="#ffffff" font-size="24" font-weight="600" text-anchor="middle">Post status</text>
    <text x="1012" y="518" fill="#f3aec0" font-size="15" font-family="'Geist Mono', monospace" text-anchor="middle">always · silent</text>
    <text x="1144" y="392" fill="#f3aec0" font-size="13" font-family="'Geist Mono', monospace" letter-spacing="0.08em" text-anchor="end">NO POST = N8N IS DOWN</text>

    <!-- legend -->
    <line x1="56" y1="612" x2="1144" y2="612" stroke="rgba(232,236,245,0.12)" stroke-width="1"/>
    <text x="56" y="644" fill="#7f8aa5" font-size="13" font-family="'Geist Mono', monospace" letter-spacing="0.14em">N8N NODE</text>
    <circle cx="196" cy="639" r="6" fill="#34d399"/>
    <text x="212" y="644" fill="#9aa4bd" font-size="15" font-family="'Geist Mono', monospace">trigger</text>
    <circle cx="340" cy="639" r="6" fill="#c084fc"/>
    <text x="356" y="644" fill="#9aa4bd" font-size="15" font-family="'Geist Mono', monospace">http</text>
    <circle cx="456" cy="639" r="6" fill="#818cf8"/>
    <text x="472" y="644" fill="#9aa4bd" font-size="15" font-family="'Geist Mono', monospace">code</text>
    <circle cx="572" cy="639" r="6" fill="#fbbf24"/>
    <text x="588" y="644" fill="#9aa4bd" font-size="15" font-family="'Geist Mono', monospace">if</text>
    <circle cx="664" cy="639" r="6" fill="#8b93a8"/>
    <text x="680" y="644" fill="#9aa4bd" font-size="15" font-family="'Geist Mono', monospace">discord</text>
    <circle cx="808" cy="639" r="6" fill="#ea4b71"/>
    <text x="824" y="644" fill="#9aa4bd" font-size="15" font-family="'Geist Mono', monospace">its silence is the alarm</text>
  </svg>
</body>
</html>
